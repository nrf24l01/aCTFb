id: example.hello
name: Example Hello
version: 1.0.0
apiVersion: "1"
description: Separate participant/admin page, backend API, private schema and own permission.
author: aCTFb examples
backend:
  mode: exec
  entrypoint: bin/plugin
  protocol: http-v1
  healthPath: /v1/health
  timeoutSeconds: 5
frontend:
  mode: iframe
  entry: index.html
permissions:
  - id: plugin.example.hello.view
    scope: board
  - id: plugin.example.hello.manage
    scope: board
capabilities:
  - core.boards.read
routes:
  - method: GET
    path: /boards/:boardUuid/hello
    permission: plugin.example.hello.view
    scope: board
    ui: true
  - method: POST
    path: /boards/:boardUuid/hello/messages
    permission: plugin.example.hello.view
    scope: board
  - method: GET
    path: /boards/:boardUuid/hello/admin
    permission: plugin.example.hello.manage
    scope: board
    ui: true
  - method: POST
    path: /boards/:boardUuid/hello/admin/settings
    permission: plugin.example.hello.manage
    scope: board
assets: assets
migrations: migrations