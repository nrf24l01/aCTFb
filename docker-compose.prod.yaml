name: actfb-prod

x-postgres-environment: &postgres-environment
  CONFIG_FILE: /app/config.yml
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-actfb}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
  POSTGRES_DBNAME: ${POSTGRES_DB:-actfb}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
  POSTGRES_TIMEZONE: UTC

x-nats-environment: &nats-environment
  NATS_HOST: nats
  NATS_PORT: "4222"

x-backend-environment: &backend-environment
  <<: [*postgres-environment, *nats-environment]
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env.prod}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env.prod}
  APP_HOST: 0.0.0.0
  APP_SECURE_COOKIES: ${APP_SECURE_COOKIES:-true}
  APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?set APP_ALLOWED_ORIGINS to the exact public origin, e.g. https://ctf.example:8443}
  APP_TRUSTED_PROXIES: ${ACTFB_PROXY_SUBNET:-10.213.77.0/28}
  AUTH_RATE_LIMIT_BACKEND: redis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  SMTP_ENABLED: ${SMTP_ENABLED:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_TEMPLATES_DIR: /app/email_templates
  EMAIL_VERIFY_ENABLED: ${EMAIL_VERIFY_ENABLED:-false}
  EMAIL_VERIFY_PERIOD: 15m
  ACTFB_INTEGRATIONS_ENABLED: ${ACTFB_INTEGRATIONS_ENABLED:-false}
  ACTFB_PLUGINS_ENABLED: ${ACTFB_PLUGINS_ENABLED:-false}
  ACTFB_PLUGINS_DIR: /app/plugins
  ACTFB_PLUGIN_SERVICE_KEY: ${ACTFB_PLUGIN_SERVICE_KEY:-}
  ACTFB_PLUGIN_RUNNER_URL: ${ACTFB_PLUGIN_RUNNER_URL:-}
  ACTFB_PLUGIN_RUNNER_TOKEN: ${ACTFB_PLUGIN_RUNNER_TOKEN:-}
  ACTFB_FILES_ENABLED: ${ACTFB_FILES_ENABLED:-false}
  ACTFB_FILE_SCAN_KEY: ${ACTFB_FILE_SCAN_KEY:-}
  CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
  CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-true}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}
  ACTFB_RUNTIME_ENABLED: ${ACTFB_RUNTIME_ENABLED:-false}
  ACTFB_CREDENTIAL_ENCRYPTION_KEY: ${ACTFB_CREDENTIAL_ENCRYPTION_KEY:-}
  ACTFB_CREDENTIAL_KEY_VERSION: ${ACTFB_CREDENTIAL_KEY_VERSION:-1}
  ACTFB_AD_ENABLED: ${ACTFB_AD_ENABLED:-false}
  ACTFB_AD_RUNNER_IMAGES: ${ACTFB_AD_RUNNER_IMAGES:-}
  ACTFB_AD_WEBHOOK_BASE_URL: ${ACTFB_AD_WEBHOOK_BASE_URL:-}
  ACTFB_AD_ALLOW_INSECURE_LOOPBACK: ${ACTFB_AD_ALLOW_INSECURE_LOOPBACK:-false}

services:
  backend:
    image: ghcr.io/nrf24l01/actfb-backend:${ACTFB_IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - plugins-data:/app/plugins
    networks:
      - actfb-net
      - actfb-proxy

  frontend:
    image: ghcr.io/nrf24l01/actfb-frontend:${ACTFB_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-proxy

  # Default baseline worker: PostgreSQL-only retention daemon.
  retention:
    image: ghcr.io/nrf24l01/actfb-retention:${ACTFB_IMAGE_TAG:-latest}
    restart: unless-stopped
    command:
      - /app/retention
      - --interval=${AUTH_RETENTION_INTERVAL:-1h}
      - --batch-size=500
      - --max-batches=100
      - --run-timeout=5m
    environment:
      <<: *postgres-environment
      AUTH_RETENTION_DAYS: ${AUTH_RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  # Default baseline worker: PostgreSQL -> NATS outbox dispatcher.
  events-dispatcher:
    image: ghcr.io/nrf24l01/actfb-events-dispatcher:${ACTFB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *nats-environment]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  # SMTP delivery profile. Requires SMTP_* plus SMTP_ENABLED=true.
  notification:
    profiles: ["email"]
    image: ghcr.io/nrf24l01/actfb-notification:${ACTFB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: *nats-environment
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TEMPLATES_DIR: /app/email_templates
    depends_on:
      nats:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  # Optional file pipeline. storage-init is a one-shot bucket initializer.
  storage-init:
    profiles: ["files"]
    image: ghcr.io/nrf24l01/actfb-storage-init:${ACTFB_IMAGE_TAG:-latest}
    restart: "no"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  file-scanner:
    profiles: ["files"]
    image: ghcr.io/nrf24l01/actfb-file-scanner:${ACTFB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *nats-environment]
      ACTFB_FILES_ENABLED: "true"
      ACTFB_FILE_SCAN_KEY: ${ACTFB_FILE_SCAN_KEY:-}
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      backend:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  # Trusted plugin supervisor. It shares the backend network namespace only so
  # its loopback control endpoint and plugin assets are reachable. It, not the
  # backend, receives the Docker socket.
  plugin-runner:
    profiles: ["plugins"]
    image: ghcr.io/nrf24l01/actfb-plugin-runner:${ACTFB_IMAGE_TAG:-latest}
    network_mode: "service:backend"
    restart: unless-stopped
    environment:
      ACTFB_PLUGIN_RUNNER_TOKEN: ${ACTFB_PLUGIN_RUNNER_TOKEN:-}
      ACTFB_PLUGIN_RUNNER_ADDR: 127.0.0.2:8092
      ACTFB_DOCKER_SOCKET: /var/run/docker.sock
      ACTFB_PLUGIN_RUNNER_NETWORK: ${ACTFB_PLUGIN_RUNNER_NETWORK:-actfb-prod_actfb-net}
      ACTFB_PLUGIN_RUNNER_ID: ${ACTFB_PLUGIN_RUNNER_ID:-actfb-prod-plugin-runner}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${ACTFB_DOCKER_GID:-999}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Trusted A+D checker worker; the only production image with git/docker CLI.
  ad-worker:
    profiles: ["ad"]
    image: ghcr.io/nrf24l01/actfb-ad-worker:${ACTFB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *nats-environment]
      ACTFB_CREDENTIAL_ENCRYPTION_KEY: ${ACTFB_CREDENTIAL_ENCRYPTION_KEY:-}
      ACTFB_CREDENTIAL_KEY_VERSION: ${ACTFB_CREDENTIAL_KEY_VERSION:-1}
      ACTFB_AD_RUNNER_IMAGES: ${ACTFB_AD_RUNNER_IMAGES:-}
      ACTFB_AD_WEBHOOK_BASE_URL: ${ACTFB_AD_WEBHOOK_BASE_URL:-}
      ACTFB_AD_ALLOW_INSECURE_LOOPBACK: ${ACTFB_AD_ALLOW_INSECURE_LOOPBACK:-false}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${ACTFB_DOCKER_GID:-999}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  # Trusted runtime worker. No Docker CLI; it uses the Go Docker API.
  instance-worker:
    profiles: ["runtime"]
    image: ghcr.io/nrf24l01/actfb-instance-worker:${ACTFB_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *nats-environment]
      ACTFB_CREDENTIAL_ENCRYPTION_KEY: ${ACTFB_CREDENTIAL_ENCRYPTION_KEY:-}
      ACTFB_CREDENTIAL_KEY_VERSION: ${ACTFB_CREDENTIAL_KEY_VERSION:-1}
      ACTFB_INSTANCE_WORKER_DOCKER_SOCKET: /var/run/docker.sock
      ACTFB_INSTANCE_WORKER_PODMAN_SOCKET: ""
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${ACTFB_DOCKER_GID:-999}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  postgres:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-actfb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-actfb}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - actfb-net

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - actfb-net

  nats:
    image: nats:2-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - actfb-net

volumes:
  postgres-data:
  redis-data:
  nats-data:
  plugins-data:

networks:
  # Database/worker traffic. No frontend and no trusted-proxy source here.
  actfb-net:
    driver: bridge
  # Only nginx and the backend share this network. The explicit subnet is the
  # backend's trusted-proxy value, so DB/worker peers cannot forge a client IP.
  actfb-proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${ACTFB_PROXY_SUBNET:-10.213.77.0/28}