syntax = "proto3";

package emails.v1;

option go_package = "github.com/nrf24l01/actfb/internal/generated/proto/emails/v1;emailv1";

message EmailTask {
  string id = 1;
  string to = 2;

  oneof payload {
    VerificationEmail verification = 3;
  }
}

message VerificationEmail {
    string username = 1;
    string code = 2;
}