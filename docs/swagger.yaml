          $ref: '#/components/schemas/SubmissionMode'
        checker:
          $ref: '#/components/schemas/SubmissionChecker'
        text:
          allOf:
          - $ref: '#/components/schemas/SubmissionTextPolicy'
          nullable: true
        files:
          allOf:
          - $ref: '#/components/schemas/SubmissionFilesPolicy'
          nullable: true
      x-validation-rules:
      - 'NONE: text/files must be null'
      - 'TEXT: text required, files null'
      - 'FILES: files required, text null'
      - 'TEXT_AND_FILES: both required'
      - 'TEXT_OR_FILES: at least one configured'
