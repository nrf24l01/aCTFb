        maxLength: 64
      message:
        type: string
        maxLength: 1024
  FileRef:
    type: object
    required:
    - uuid
    - filename
    - contentType
    - size
    - sha256
    additionalProperties: false
    description: Immutable clean-file metadata only. Storage bucket/key/version are intentionally absent. 
      Download URLs are never embedded in list/resource responses.
    properties:
      uuid:
        $ref: '#/definitions/UUID'
      filename:
        type: string
        minLength: 1
        maxLength: 255
      contentType:
        type: string
        minLength: 1
        maxLength: 255
      size:
        type: integer
        minimum: 1
      sha256:
        type: string
        pattern: ^[A-Fa-f0-9]{64}$
  DownloadUrlResponse:
    type: object
    required:
    - url
    - expiresAt
    additionalProperties: false
    properties:
      url:
        type: string
        format: uri
      expiresAt:
        type: string
        format: date-time
    description: 'Short-lived authorized GET URL. The storage response must force Content-Disposition: attachment
      and be served from an isolated download origin.'
  RatingConfig:
    type: object
    required:
    - visibility
    additionalProperties: false
    properties:
      visibility:
        $ref: '#/definitions/RatingVisibility'
  TeamSettings:
    type: object
    required:
    - minMembers
    - maxMembers
    - allowSelfCreate
    - allowLeaveAfterStart
    additionalProperties: false
    properties:
      minMembers:
        type: integer
        minimum: 1
        maximum: 100
      maxMembers:
        type: integer
        minimum: 1
        maximum: 100
