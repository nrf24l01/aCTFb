x-security-baseline:
  transport:
  - Production deployments MUST use HTTPS/TLS only.
  - Access tokens MUST NOT be accepted from query parameters.
  authentication:
  - Access JWTs SHOULD be short-lived (recommended <= 15 minutes).
  - Refresh tokens MUST rotate on every refresh; detected token reuse revokes the whole refresh-token family.
  - Refresh cookies MUST be HttpOnly, Secure and scoped to /api/v2/auth; SameSite=Strict is recommended where 
    deployment topology permits.
  - Refresh/logout endpoints MUST validate Origin/Referer against the configured frontend origins.
  authorization:
  - Every resource lookup MUST enforce board membership/ACL and resource ownership in the same authorization 
    decision; UUID knowledge never grants access.
  - TEAM-scoped resources derive the active team from authenticated membership; clients never choose an 
    arbitrary owner UUID.
  - All /admin operations require ADMIN role in addition to a valid bearer token.
  files:
  - No generic upload or download endpoints exist.
  - S3/object-storage buckets MUST have public access blocked; object keys are server-generated random 
    identifiers and never client-selected.
  - Presigned upload URLs MUST target exactly one object key, expire quickly (recommended <= 5 minutes), and 
    bind expected Content-Type and checksum.
  - Completion MUST verify object existence, exact size, SHA-256 checksum, configured MIME allow-list, detected 
    file type/magic and security scan result before READY.
  - Archives that are unpacked MUST be checked for path traversal, symlinks, excessive expansion and file-count 
    limits.
  - Presigned download URLs MUST be authorized at request time, short-lived (recommended <= 60 seconds), and use
    attachment disposition on an isolated download origin.
  - Submission files become immutable after finalization and cannot be re-used by another submission or context.
  - Uploads MUST land in a non-public quarantine namespace/bucket. Quarantine objects are never downloadable by 
    participants.
  - READY is set only for the exact validated object version; preferably copy the validated bytes server-side 
    into an immutable clean namespace and reference only that clean object/version.
  - Presigned PUT should be create-only where supported (for example a signed conditional write) so the same URL
    cannot overwrite an already uploaded object.
  - Orphaned drafts/quarantine objects MUST have short lifecycle cleanup and must not be attachable after draft 
    expiry.
  concurrency:
  - Quota checks and state transitions for instances/submissions MUST be atomic.
  - Operations that may be retried use Idempotency-Key to prevent duplicate scoring/provisioning.
  secrets:
  - Integration credentials, accepted answers, hidden tests and provider secrets are write-only and never 
    returned or logged.
  - Participant endpoint credentials are returned only to the owning subject when explicitly configured as 
    visible.
  networking:
  - Public endpoint hostnames/ports are generated only from the selected PROXMOX/CONTAINER integration 
    publication policy; task/pentest configs cannot inject arbitrary public hosts.
  - HTTP reverse proxies must route by an allow-listed generated hostname and must not trust 
    participant-supplied Host/X-Forwarded-* headers for provisioning decisions.
  - PRIVATE endpoint addresses are returned only when the board topology intentionally exposes them to the 
    owning subject.
  external_integrations:
  - Integration base URLs are admin-only and MUST be validated against an explicit deployment allow-list or SSRF
    policy before any server-side connection.
  - Reject/allow-list loopback, link-local, cloud metadata, Unix socket and unexpected private-network 
    destinations; re-check redirects and resolved addresses to prevent DNS rebinding.
  - Git repository fields are provider-native repository identifiers, not arbitrary clone URLs.
  - Runner/container images should come from trusted registries and be pinned by immutable digest for 
    competition-critical workloads.
x-response-security-headers:
  sensitiveResponses:
  - 'Cache-Control: no-store'
  - 'Pragma: no-cache'
  downloads:
  - 'Content-Disposition: attachment'
  - 'X-Content-Type-Options: nosniff'
  browserApi:
  - Content-Security-Policy is enforced by the frontend/application origin; presigned download content is served
    from a separate non-cookie origin.
x-error-message-catalog:
  INVALID_JSON: Malformed JSON
  VALIDATION_FAILED: Validation failed
  UNSUPPORTED_MEDIA_TYPE: Unsupported media type; expected application/json
  EMAIL_ALREADY_EXISTS: Email already exists
  USERNAME_ALREADY_EXISTS: Username already exists
  TEAM_NAME_ALREADY_EXISTS: Team name already exists
  BOARD_SLUG_ALREADY_EXISTS: Board slug already exists
  AUDIENCE_NAME_ALREADY_EXISTS: Audience name already exists
  MODULE_NAME_ALREADY_EXISTS: Module name already exists
  VULNERABILITY_KEY_ALREADY_EXISTS: Vulnerability key already exists
  ACCESS_GROUP_ALREADY_EXISTS: Access group already exists
  INTEGRATION_NAME_ALREADY_EXISTS: Integration name already exists
  CURRENT_PASSWORD_INCORRECT: Current password is incorrect
  INVALID_CREDENTIALS: Invalid credentials
  ALREADY_JOINED: Already joined
  BOARD_REGISTRATION_CLOSED: Board registration is closed
  BOARD_FINISHED: Board is finished
  TEAM_FULL: Team is full
  IDEMPOTENCY_KEY_REUSED: Idempotency key was already used with a different request
x-http-error-contract:
  scope: 'All endpoints: use consistent ApiError/ValidationError envelopes; map errors before dispatch to handlers.'
  '400': INVALID_JSON only. Applicable to endpoints consuming JSON bodies. An absent required body or 
    well-formed JSON of the wrong shape is 422.
  '401': Authentication absent/invalid; login distinguishes INVALID_CREDENTIALS without revealing account 
    existence. Webhooks verify signature on raw bytes first.
  '403': Authenticated principal lacks role/access, access is disabled, or operation forbidden by policy. Do not
    reveal hidden foreign resources.
  '404': Resource not found or intentionally concealed for access control. Referenced, nonexistent resources use
    specific *_NOT_FOUND codes.
  '409': Unique constraints, repeat joins, concurrent state changes, locked operations, optimistic or 
    idempotency conflicts. Enforce uniqueness atomically in database.
  '410': Issued token/session/draft/upload expired or consumed where expired-resource semantics apply.
  '413': Body/upload exceeds maximum allowed bytes.
  '415': Wrong Content-Type for required JSON body (application/json).
  '422': Valid JSON that fails shape/field/business-input validation; invalid UUIDs, enums, query limits and 
    Idempotency-Key format also map here. Never use for server misconfiguration.
  '429': Client throttled; Retry-After indicates earliest retry where applicable.
  '500': Unexpected internal failure, not known user input or domain conflict.
  '502': External upstream returned an error or inconsistent response.
  '503': Required external dependency unavailable.
  security: For password-reset/request, return the same 202 for known and unknown email. Avoid user enumeration 
    for login, and do not expose hidden board/module/file resources.
  idempotency: Successful exact retries with the same Idempotency-Key return the same logical result, not 409. 
    Use 409 IDEMPOTENCY_KEY_REUSED only for a different payload.
  logout: Logout is idempotent and returns 204 even for missing or invalid refresh cookie; invalid 
    Origin/Referer returns 403 ORIGIN_NOT_ALLOWED.
