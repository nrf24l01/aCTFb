openapi: 3.0.3
info:
  title: aCTFb Universal Board API
  version: 2.1.0
  description: Universal security competition/training board API. Supports TASKS, ATTACK_DEFENSE and PENTEST boards. Scoring
    is always enabled; rating.visibility controls only whether participants may see the global rating/place. Binary content
    is never proxied through the API and there is no generic upload API. Presigned S3-compatible uploads exist only inside
    an authorized TASK or PENTEST context (participant submission draft or admin attachment scope). All object-storage buckets
    are private; presigned URLs are short-lived and context-bound. Unless stated otherwise, every non-2xx response returns
    ApiError or ValidationError.
servers:
- url: /api/v2
  description: API v2
tags:
- name: Auth
- name: Me
- name: Boards
- name: Teams
- name: Rating
- name: Tasks
- name: Task Files
- name: Task Instances
- name: Attack Defense
- name: Pentest
- name: Pentest Files
- name: Webhooks
- name: Admin Users
- name: Admin Access Groups
- name: Admin Boards
- name: Admin Participants
- name: Admin Teams
- name: Admin Rating
- name: Admin Submissions
- name: Admin Tasks
- name: Admin Task Files
- name: Admin Attack Defense
- name: Admin Pentest
- name: Admin Pentest Files
- name: Admin Instances
- name: Admin Integrations
- name: Admin Audit
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered; refresh token is set in HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '409':
        - EMAIL_ALREADY_EXISTS
        - USERNAME_ALREADY_EXISTS
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      x-response-headers:
      - 'Cache-Control: no-store'
      - 'Pragma: no-cache'
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful; refresh token is set in HttpOnly cookie.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: 'Rotating refresh token cookie: HttpOnly; Secure; Path=/api/v2/auth; SameSite=Strict where deployment
                topology permits.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '401':
        - INVALID_CREDENTIALS
        '403':
        - USER_DISABLED
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      x-security-controls:
      - Rate-limit by normalized account identifier and source network; do not log password or access/refresh tokens.
      - Use constant-time password verification path and a generic INVALID_CREDENTIALS response for unknown user/wrong password.
      x-response-headers:
      - 'Cache-Control: no-store'
      - 'Pragma: no-cache'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh access token
      operationId: refreshToken
      security:
      - refreshCookie: []
      responses:
        '200':
          description: New access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '401':
        - REFRESH_TOKEN_MISSING
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_EXPIRED
        '403':
        - USER_DISABLED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      x-security-controls:
      - Refresh cookie is HttpOnly + Secure and scoped to /api/v2/auth.
      - Validate Origin/Referer against allowed frontend origins before using cookie credentials.
      - Refresh tokens are one-time rotating tokens; reuse detection revokes the token family.
      x-response-headers:
      - 'Cache-Control: no-store'
      - 'Pragma: no-cache'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: logout
      security:
      - refreshCookie: []
      responses:
        '204':
          description: Refresh cookie invalidated and cleared.
        '500':
          $ref: '#/components/responses/InternalError'
      x-security-controls:
      - Refresh cookie is HttpOnly + Secure and scoped to /api/v2/auth.
      - Validate Origin/Referer against allowed frontend origins before using cookie credentials.
      - Refresh tokens are one-time rotating tokens; reuse detection revokes the token family.
  /auth/password-reset/request:
    post:
      tags:
      - Auth
      summary: Request password reset
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted. Response never reveals whether email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
  /auth/password-reset/confirm:
    post:
      tags:
      - Auth
      summary: Confirm password reset
      operationId: confirmPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '400':
        - RESET_TOKEN_INVALID
        '410':
        - RESET_TOKEN_EXPIRED
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
  /auth/email-verification/request:
    post:
      tags:
      - Auth
      summary: Request email verification
      operationId: requestEmailVerification
      responses:
        '202':
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '401':
        - UNAUTHORIZED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
  /auth/email-verification/confirm:
    post:
      tags:
      - Auth
      summary: Confirm email verification
      operationId: confirmEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationConfirmRequest'
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '400':
        - VERIFICATION_TOKEN_INVALID
        '410':
        - VERIFICATION_TOKEN_EXPIRED
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
  /me:
    get:
      tags:
      - Me
      summary: Current user
      operationId: getMe
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Me
      summary: Update current user
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MePatchRequest'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '409':
        - USERNAME_ALREADY_EXISTS
        '422':
        - VALIDATION_FAILED
  /me/password:
    post:
      tags:
      - Me
      summary: Change password
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '400':
        - INVALID_CREDENTIALS
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
  /boards:
    get:
      tags:
      - Boards
      summary: List visible boards
      operationId: listBoards
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
      - $ref: '#/components/parameters/QueryParam'
      - name: mode
        in: query
        schema:
          $ref: '#/components/schemas/BoardMode'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/BoardStatus'
      - name: participationMode
        in: query
        schema:
          $ref: '#/components/schemas/ParticipationMode'
      responses:
        '200':
          description: Visible boards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /boards/{boardUuid}:
    get:
      tags:
      - Boards
      summary: Board details
      operationId: getBoard
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      responses:
        '200':
          description: Board details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
        '422':
        - VALIDATION_FAILED
  /boards/{boardUuid}/join:
    post:
      tags:
      - Boards
      summary: Join board
      operationId: joinBoard
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BoardJoinRequest'
      responses:
        '200':
          description: Joined board.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - BOARD_REGISTRATION_CLOSED
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
        '409':
        - ALREADY_JOINED
        - BOARD_FINISHED
        '422':
        - INVALID_INVITE_CODE
        - VALIDATION_FAILED
  /boards/{boardUuid}/leave:
    post:
      tags:
      - Boards
      summary: Leave board
      operationId: leaveBoard
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      responses:
        '204':
          description: Left board.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
        '409':
        - BOARD_NOT_JOINED
        - BOARD_LEAVE_NOT_ALLOWED
        - TEAM_CAPTAIN_MUST_TRANSFER
  /boards/{boardUuid}/me:
    get:
      tags:
      - Boards
      summary: My participation state
      operationId: getBoardMe
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      responses:
        '200':
          description: Participation, own score and place. place is null when rating is hidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardMe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
  /boards/{boardUuid}/team:
    get:
      tags:
      - Teams
      summary: My team
      operationId: getMyTeam
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      responses:
        '200':
          description: Current team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - WRONG_BOARD_MODE
        - BOARD_ACCESS_DENIED
        '404':
        - TEAM_NOT_FOUND
        - BOARD_NOT_FOUND
    patch:
      tags:
      - Teams
      summary: Update my team
      operationId: updateMyTeam
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamPatchRequest'
      responses:
        '200':
          description: Updated team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - TEAM_CAPTAIN_REQUIRED
        - BOARD_TEAM_CHANGES_LOCKED
        '404':
        - TEAM_NOT_FOUND
        '409':
        - TEAM_NAME_ALREADY_EXISTS
        '422':
        - VALIDATION_FAILED
  /boards/{boardUuid}/teams:
    post:
      tags:
      - Teams
      summary: Create team
      operationId: createTeam
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateRequest'
      responses:
        '201':
          description: Team created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - WRONG_BOARD_MODE
        - TEAM_CREATION_DISABLED
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
        '409':
        - USER_ALREADY_IN_TEAM
        - TEAM_NAME_ALREADY_EXISTS
        - BOARD_NOT_JOINED
        '422':
        - VALIDATION_FAILED
  /boards/{boardUuid}/teams/join:
    post:
      tags:
      - Teams
      summary: Join team
      operationId: joinTeam
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamJoinRequest'
      responses:
        '200':
          description: Joined team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - WRONG_BOARD_MODE
        - BOARD_TEAM_CHANGES_LOCKED
        '404':
        - TEAM_NOT_FOUND
        - BOARD_NOT_FOUND
        '409':
        - TEAM_FULL
        - USER_ALREADY_IN_TEAM
        '422':
        - INVALID_TEAM_INVITE_KEY
        - VALIDATION_FAILED
  /boards/{boardUuid}/team/invite-key:
    get:
      tags:
      - Teams
      summary: Get team invite key
      operationId: getTeamInviteKey
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      responses:
        '200':
          description: Invite key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInviteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - TEAM_CAPTAIN_REQUIRED
        '404':
        - TEAM_NOT_FOUND
  /boards/{boardUuid}/team/invite-key/rotate:
    post:
      tags:
      - Teams
      summary: Rotate team invite key
      operationId: rotateTeamInviteKey
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      responses:
        '200':
          description: New invite key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInviteResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - TEAM_CAPTAIN_REQUIRED
        '404':
        - TEAM_NOT_FOUND
        '409':
        - BOARD_TEAM_CHANGES_LOCKED
  /boards/{boardUuid}/team/leave:
    post:
      tags:
      - Teams
      summary: Leave team
      operationId: leaveTeam
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      responses:
        '204':
          description: Left team.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '404':
        - TEAM_NOT_FOUND
        '409':
        - TEAM_CAPTAIN_MUST_TRANSFER
        - BOARD_TEAM_CHANGES_LOCKED
  /boards/{boardUuid}/team/members/{userUuid}:
    delete:
      tags:
      - Teams
      summary: Remove team member
      operationId: removeTeamMember
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      - $ref: '#/components/parameters/UserUuidParam'
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
      x-error-codes:
        '403':
        - TEAM_CAPTAIN_REQUIRED
        '404':
        - TEAM_MEMBER_NOT_FOUND
        '409':
        - BOARD_TEAM_CHANGES_LOCKED
  /boards/{boardUuid}/team/captain:
    post:
      tags:
      - Teams
      summary: Transfer team captain
      operationId: transferTeamCaptain
      parameters:
      - $ref: '#/components/parameters/BoardUuidParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCaptainRequest'
      responses:
        '200':
          description: Updated team.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Team'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
