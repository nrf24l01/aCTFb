components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Short-lived access JWT. Send only in Authorization: Bearer header; never in URL/query/cookies.'
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Rotating HttpOnly Secure refresh cookie scoped to /api/v2/auth. Refresh/logout additionally validate allowed
        Origin/Referer.
    gitWebhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: Provider-specific HMAC/signature. Server also verifies delivery ID, timestamp/freshness when available,
        expected repository, expected branch/event and payload size before enqueueing work.
  parameters:
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    QueryParam:
      name: query
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
    BoardUuidParam:
      name: boardUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    TaskUuidParam:
      name: taskUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    UserUuidParam:
      name: userUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    TeamUuidParam:
      name: teamUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    GroupUuidParam:
      name: groupUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    FileUuidParam:
      name: fileUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    RunUuidParam:
      name: runUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    VulnerabilityUuidParam:
      name: vulnerabilityUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    RepositoryBindingUuidParam:
      name: repositoryBindingUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    EnvironmentUuidParam:
      name: environmentUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    InstanceUuidParam:
      name: instanceUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IntegrationUuidParam:
      name: integrationUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    SubmissionUuidParam:
      name: submissionUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    DraftUuidParam:
      name: draftUuid
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    IdempotencyKeyParam:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key used to make this state-changing operation retry-safe. Same key + same principal +
        same route must produce the same logical result; reuse with a different payload returns 409 IDEMPOTENCY_KEY_REUSED.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9._:-]+$
  responses:
    BadRequest:
      description: 'Bad request. Typical code: BAD_REQUEST'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Authenticated but operation is forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Resource not found, or intentionally hidden when revealing its existence would disclose another tenant/board
        resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Gone:
      description: Resource/token existed but is expired.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Declared or actual file size exceeds configured limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationFailed:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    RateLimited:
      description: Too many requests. Retry-After may be returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
      headers:
        Retry-After:
          description: Seconds until retry is allowed.
          schema:
            type: integer
            minimum: 1
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadGateway:
      description: External provider returned an error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Required provider/runner is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
