            type: string
            minLength: 1
            maxLength: 255
      x-validation-rules:
      - maxCount must be >= minCount
      x-security-rules:
      - Server enforces count/size/type policy before issuing each presign and again at finalization.
      - No file UUID from another draft/resource can satisfy this policy.
