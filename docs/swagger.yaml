    - DRAFT
    - SCHEDULED
    - ACTIVE
    - FINISHED
    - ARCHIVED
  BoardVisibility:
    type: string
    enum:
    - PUBLIC
    - PRIVATE
  RatingVisibility:
    type: string
    enum:
    - PUBLIC
    - HIDDEN
    description: Scoring always runs. HIDDEN only hides global scoreboard and participant place.
  SubjectType:
    type: string
    enum:
    - USER
    - TEAM
  InstanceStatus:
    type: string
    enum:
    - PROVISIONING
    - RUNNING
    - RESETTING
    - DESTROYING
    - ERROR
    - EXPIRED
  InstanceNodeKind:
