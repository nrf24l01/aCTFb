  FileValidationStatus:
    type: string
    enum:
    - AWAITING_UPLOAD
    - VALIDATING
    - READY
    - REJECTED
    - ATTACHED
    - EXPIRED
  SubmissionDraftStatus:
    type: string
    enum:
    - OPEN
    - CONSUMED
    - EXPIRED
  PendingFile:
    allOf:
    - $ref: '#/definitions/FileRef'
    - type: object
      required:
      - status
      properties:
        status:
          $ref: '#/definitions/FileValidationStatus'
        rejectionCode:
          type: string
          x-nullable: true
          maxLength: 128
          description: Machine-readable reason when status=REJECTED. No malware/signature internals are exposed.
    description: Logical file metadata plus quarantine/validation state. Only READY files may be finalized; 
      ATTACHED files are immutable. REJECTED/EXPIRED quarantine objects are never downloadable.
  ScopedFilePresignRequest:
    type: object
    required:
    - filename
    - contentType
    - size
    - sha256
    additionalProperties: false
    description: The client supplies only immutable file metadata. Context/purpose, owner, S3 key, limits and 
      allowed types are derived from the TASK/PENTEST resource and cannot be selected by the client.
    properties:
      filename:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[^/\\\x00-\x1F]+$
      contentType:
        type: string
        minLength: 1
        maxLength: 255
      size:
        type: integer
        minimum: 1
        maximum: 1073741824
      sha256:
        type: string
        pattern: ^[A-Fa-f0-9]{64}$
        description: SHA-256 of the exact bytes to be uploaded.
    x-validation-rules:
    - filename must be a base name only and contain no slash, backslash, NUL or control characters
    - effective max size and MIME allow-list come from the task/pentest attachment or submission policy
    - declared MIME is advisory; detected type/magic is checked after upload
  ScopedFilePresignResponse:
    type: object
    required:
    - fileUuid
    - method
    - uploadUrl
    - requiredHeaders
    - expiresAt
    additionalProperties: false
    properties:
      fileUuid:
        $ref: '#/definitions/UUID'
      method:
        type: string
        enum:
        - PUT
      uploadUrl:
        type: string
        format: uri
      requiredHeaders:
        type: object
        additionalProperties:
          type: string
        description: Signed headers that must be sent exactly as returned. Typically includes Content-Type and 
          checksum; deployment may also sign a create-only conditional header and server-side encryption 
          requirements.
      expiresAt:
        type: string
        format: date-time
    x-security-controls:
    - URL is bound to exactly one server-generated object key and cannot upload another key
    - URL expires quickly and cannot be refreshed outside the original authorized resource context
    - bucket is private and public ACL/object ownership changes are forbidden by bucket policy
    - Upload target is quarantine-only; this URL can never address a clean/attached object directly.
