swagger: '2.0'
info:
  title: aCTFb Universal Board API
  version: 3.0.0
  description: Universal security competition/training board API. A board is a common event container with 
    audiences and multiple modules. A board may contain multiple TASKS, ATTACK_DEFENSE and PENTEST modules 
    simultaneously, including multiple modules of the same type. Modules scope content, schedule and audience 
    access; allowedTaskTypes is validated against the module type. Scoring is always enabled; rating.visibility 
    controls only whether participants may see the global rating/place. Binary content is never proxied through 
    the API and there is no generic upload API. Presigned S3-compatible uploads exist only inside an authorized 
    module/resource context. All object-storage buckets are private; presigned URLs are short-lived and 
    context-bound. Unless stated otherwise, every non-2xx response returns ApiError or ValidationError.
basePath: /api/v2
tags:
- name: Auth
- name: Me
- name: Boards
- name: Audiences
- name: Modules
- name: Teams
- name: Rating
- name: Tasks
- name: Task Files
- name: Task Instances
- name: Attack Defense
- name: Pentest
- name: Pentest Files
- name: Webhooks
- name: Admin Users
- name: Admin Access Groups
- name: Admin Boards
- name: Admin Audiences
- name: Admin Modules
- name: Admin Participants
- name: Admin Teams
- name: Admin Rating
- name: Admin Submissions
- name: Admin Tasks
- name: Admin Task Files
- name: Admin Attack Defense
- name: Admin Pentest
- name: Admin Pentest Files
- name: Admin Instances
- name: Admin Integrations
- name: Admin Audit
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      x-error-codes:
        '400':
        - INVALID_JSON
        '409':
        - EMAIL_ALREADY_EXISTS
        - USERNAME_ALREADY_EXISTS
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      tags:
      - Auth
      summary: Register
      operationId: register
      security: []
      x-response-headers:
      - 'Cache-Control: no-store'
      - 'Pragma: no-cache'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
      responses:
        '201':
          description: Registered; refresh token is set in HttpOnly cookie.
          headers:
            Set-Cookie:
              type: string
          schema:
            $ref: '#/definitions/RegisterResponse'
        '400':
          $ref: '#/responses/BadRequest'
        '409':
          $ref: '#/responses/Conflict'
        '415':
          $ref: '#/responses/UnsupportedMediaType'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /auth/login:
    post:
      x-error-codes:
        '400':
        - INVALID_JSON
        '401':
        - INVALID_CREDENTIALS
        - UNAUTHORIZED
        '403':
        - USER_DISABLED
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      tags:
      - Auth
      summary: Login
      operationId: login
      security: []
      x-security-controls:
      - Rate-limit by normalized account identifier and source network; do not log password or access/refresh 
        tokens.
      - Use constant-time password verification path and a generic INVALID_CREDENTIALS response for unknown 
        user/wrong password.
      x-response-headers:
      - 'Cache-Control: no-store'
      - 'Pragma: no-cache'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      responses:
        '200':
          description: Login successful; refresh token is set in HttpOnly cookie.
          headers:
            Set-Cookie:
              description: 'Rotating refresh token cookie: HttpOnly; Secure; Path=/api/v2/auth; SameSite=Strict where
                deployment topology permits.'
              type: string
          schema:
            $ref: '#/definitions/LoginResponse'
        '400':
          $ref: '#/responses/BadRequest'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '415':
          $ref: '#/responses/UnsupportedMediaType'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /auth/refresh:
    post:
      x-error-codes:
        '401':
        - REFRESH_TOKEN_MISSING
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_EXPIRED
        - UNAUTHORIZED
        '403':
        - USER_DISABLED
        - ORIGIN_NOT_ALLOWED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      tags:
      - Auth
      summary: Refresh access token
      operationId: refreshToken
      security:
      - refreshCookie: []
      x-security-controls:
      - Refresh cookie is HttpOnly + Secure and scoped to /api/v2/auth.
      - Validate Origin/Referer against allowed frontend origins before using cookie credentials.
      - Refresh tokens are one-time rotating tokens; reuse detection revokes the token family.
      x-response-headers:
      - 'Cache-Control: no-store'
      - 'Pragma: no-cache'
      responses:
        '200':
          description: New access token.
          schema:
            $ref: '#/definitions/TokenResponse'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
  /auth/logout:
    post:
      x-error-codes:
        '403':
        - ORIGIN_NOT_ALLOWED
        '500':
        - INTERNAL_ERROR
      tags:
      - Auth
      summary: Logout
      operationId: logout
      security: []
      x-security-controls:
      - Refresh cookie is HttpOnly + Secure and scoped to /api/v2/auth.
      - Validate Origin/Referer against allowed frontend origins before using cookie credentials.
      - Refresh tokens are one-time rotating tokens; reuse detection revokes the token family.
      responses:
        '204':
          description: 'Idempotent logout: clears refresh cookie and revokes it when present; returns 204 even if
            cookie is absent or already invalid.'
        '403':
          $ref: '#/responses/Forbidden'
        '500':
          $ref: '#/responses/InternalError'
  /auth/password-reset/request:
