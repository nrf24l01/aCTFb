        $ref: '#/definitions/UUID'
      email:
        $ref: '#/definitions/Email'
      username:
        $ref: '#/definitions/Username'
      emailVerified:
        type: boolean
      roles:
        type: array
        uniqueItems: true
        items:
          type: string
          enum:
          - user
          - admin
      createdAt:
        type: string
        format: date-time
  LoginRequest:
    type: object
    required:
    - username
    - password
    additionalProperties: false
    properties:
      username:
        $ref: '#/definitions/Username'
      password:
        $ref: '#/definitions/Password'
