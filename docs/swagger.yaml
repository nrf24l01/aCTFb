securityDefinitions:
  bearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: 'Short-lived access JWT. Send only in Authorization: Bearer header; never in URL/query/cookies. Swagger
      2.0 representation of HTTP Bearer authentication; value is `Bearer <JWT>`.'
  refreshCookie:
    type: apiKey
    name: Cookie
    in: header
    description: Rotating HttpOnly Secure refresh cookie scoped to /api/v2/auth. Refresh/logout additionally 
      validate allowed Origin/Referer. Swagger 2.0 cannot model cookie auth directly; send cookie `refreshToken`
      in the Cookie header.
    x-cookie-name: refreshToken
  gitWebhookSignature:
    type: apiKey
    name: X-Webhook-Signature
    in: header
    description: Provider-specific HMAC/signature. Server also verifies delivery ID, timestamp/freshness when 
      available, expected repository, expected branch/event and payload size before enqueueing work.
