      produces:
      - application/json
  /auth/password-reset/confirm:
    post:
      x-error-codes:
        '400':
        - INVALID_JSON
        '410':
        - RESET_TOKEN_EXPIRED
        - RESET_TOKEN_USED
        '415':
        - UNSUPPORTED_MEDIA_TYPE
        '422':
        - RESET_TOKEN_INVALID
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      tags:
      - Auth
      summary: Confirm password reset
      operationId: confirmPasswordReset
      security: []
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password changed.
          schema:
            $ref: '#/definitions/StatusResponse'
        '400':
          $ref: '#/responses/BadRequest'
        '410':
          $ref: '#/responses/Gone'
        '415':
          $ref: '#/responses/UnsupportedMediaType'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
      x-error-semantics: Invalid or unrecognized token -> 422; expired/consumed token -> 410; malformed JSON -> 
        400.
  /auth/email-verification/request:
    post:
      x-error-codes:
        '401':
        - UNAUTHORIZED
        '409':
        - EMAIL_ALREADY_VERIFIED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      tags:
