    InstancePublicationPolicy:
      type: object
      additionalProperties: false
      properties:
        publicTcpHost:
          type: string
          minLength: 1
          maxLength: 255
          description: Fixed public FQDN/IP advertised for TCP/UDP mappings.
        publicPortFrom:
          type: integer
          minimum: 1
          maximum: 65535
        publicPortTo:
          type: integer
          minimum: 1
          maximum: 65535
        httpBaseDomain:
          type: string
          minLength: 1
          maxLength: 253
          description: Trusted DNS suffix used by the platform to generate per-instance HTTP hostnames.
        forceHttps:
