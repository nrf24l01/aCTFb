      - REFRESH_TOKEN_MISSING
      - REFRESH_TOKEN_INVALID
      - REFRESH_TOKEN_EXPIRED
      - RESET_TOKEN_INVALID
      - RESET_TOKEN_EXPIRED
      - VERIFICATION_TOKEN_INVALID
      - VERIFICATION_TOKEN_EXPIRED
      - BOARD_NOT_FOUND
      - BOARD_ACCESS_DENIED
      - BOARD_NOT_JOINED
      - BOARD_REGISTRATION_CLOSED
      - BOARD_NOT_STARTED
      - BOARD_NOT_ACTIVE
      - BOARD_FINISHED
      - BOARD_LEAVE_NOT_ALLOWED
      - BOARD_DELETE_NOT_ALLOWED
      - BOARD_STATE_CONFLICT
      - ALREADY_JOINED
      - INVALID_INVITE_CODE
      - WRONG_BOARD_MODE
      - RATING_HIDDEN
      - TEAM_NOT_FOUND
      - TEAM_FULL
      - TEAM_NAME_ALREADY_EXISTS
      - TEAM_CREATION_DISABLED
      - TEAM_CAPTAIN_REQUIRED
      - TEAM_CAPTAIN_MUST_TRANSFER
      - TEAM_MEMBER_NOT_FOUND
      - USER_ALREADY_IN_TEAM
      - USER_NOT_IN_TEAM
      - INVALID_TEAM_INVITE_KEY
      - BOARD_TEAM_CHANGES_LOCKED
      - TASK_NOT_FOUND
      - TASK_NOT_AVAILABLE
      - TASK_ALREADY_SOLVED
      - SUBMISSION_NOT_FOUND
      - SUBMISSION_RATE_LIMITED
      - SUBMISSION_REVIEW_REQUIRED
      - CHECKER_ERROR
      - FILE_TOO_LARGE
      - UNSUPPORTED_FILE_TYPE
      - FILE_SIZE_MISMATCH
      - FILE_VALIDATION_FAILED
      - S3_PRESIGN_FAILED
      - S3_OBJECT_NOT_FOUND
      - TASK_INSTANCE_NOT_SUPPORTED
      - INSTANCE_NOT_FOUND
      - INSTANCE_ALREADY_EXISTS
