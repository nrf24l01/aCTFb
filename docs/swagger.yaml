    SubmissionFilesPolicy:
      type: object
      required:
      - required
      - minCount
      - maxCount
      - maxSizeBytes
      - allowedContentTypes
      additionalProperties: false
      properties:
        required:
          type: boolean
        minCount:
          type: integer
          minimum: 0
          maximum: 100
        maxCount:
          type: integer
          minimum: 1
          maximum: 100
        maxSizeBytes:
          type: integer
          minimum: 1
