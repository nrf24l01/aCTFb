responses:
  BadRequest:
    description: '400 INVALID_JSON: request body is not syntactically valid JSON (including invalid JSON encoding
      or truncated JSON). A JSON value that parses but does not match the expected request schema is 422, not 400.'
    schema:
      $ref: '#/definitions/ApiError'
  Unauthorized:
    description: '401: missing, invalid, expired, or otherwise unacceptable authentication credentials.'
    schema:
      $ref: '#/definitions/ApiError'
  Forbidden:
    description: Authenticated but operation is forbidden.
    schema:
      $ref: '#/definitions/ApiError'
  NotFound:
    description: Resource not found, or intentionally hidden when revealing its existence would disclose another
      tenant/board resource.
    schema:
      $ref: '#/definitions/ApiError'
  Conflict:
    description: '409: a request contradicts a uniqueness constraint or current resource state; the code identifies
      the exact condition.'
    schema:
      $ref: '#/definitions/ApiError'
  Gone:
    description: '410: a previously issued expiring token, resource draft, or upload session is no longer usable.'
    schema:
      $ref: '#/definitions/ApiError'
  PayloadTooLarge:
    description: '413: declared or actual request/upload file size exceeds the configured limit.'
    schema:
      $ref: '#/definitions/ApiError'
  ValidationFailed:
    description: '422: syntactically valid JSON with invalid field values/structure, or invalid path/query/header
      parameters. VALIDATION_FAILED carries fieldErrors; domain-specific 422 codes may omit fieldErrors.'
    schema:
      $ref: '#/definitions/ValidationError'
  RateLimited:
    description: Too many requests. Retry-After may be returned.
    headers:
      Retry-After:
        description: Seconds until retry is allowed.
        type: integer
        minimum: 1
    schema:
      $ref: '#/definitions/ApiError'
  InternalError:
    description: Internal server error.
    schema:
      $ref: '#/definitions/ApiError'
  BadGateway:
    description: External provider returned an error.
    schema:
      $ref: '#/definitions/ApiError'
  ServiceUnavailable:
    description: Required provider/runner is unavailable.
    schema:
      $ref: '#/definitions/ApiError'
  UnsupportedMediaType:
    description: '415 UNSUPPORTED_MEDIA_TYPE: request with a required JSON body uses an unsupported Content-Type (expected
      application/json).'
    schema:
      $ref: '#/definitions/ApiError'
