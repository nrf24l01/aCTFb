  ApiError:
    type: object
    required:
    - code
    - message
    - traceId
    - timestamp
    - path
    additionalProperties: false
    properties:
      code:
        $ref: '#/definitions/ErrorCode'
      message:
        type: string
        minLength: 1
        maxLength: 1024
      traceId:
        $ref: '#/definitions/UUID'
      timestamp:
        type: string
        format: date-time
      path:
        type: string
        minLength: 1
        maxLength: 2048
      details:
        type: object
        additionalProperties: true
    description: Error details MUST NOT contain passwords, refresh/access tokens, integration secrets, accepted 
      answers, hidden tests, raw webhook secrets or participant endpoint passwords.
  FieldError:
    type: object
    required:
    - field
    - issue
    additionalProperties: false
    properties:
      field:
        type: string
        minLength: 1
        maxLength: 512
      issue:
        type: string
        minLength: 1
        maxLength: 1024
      rejectedValue:
        x-nullable: true
      code:
        type: string
        description: Optional stable field-level validator reason, e.g. REQUIRED, INVALID_FORMAT, INVALID_TYPE, 
          OUT_OF_RANGE.
  ValidationError:
    type: object
    required:
    - code
    - message
    - traceId
    - timestamp
    - path
    additionalProperties: false
    properties:
      code:
        $ref: '#/definitions/ErrorCode'
      message:
        type: string
      traceId:
        $ref: '#/definitions/UUID'
      timestamp:
        type: string
        format: date-time
      path:
        type: string
      fieldErrors:
        type: array
        minItems: 1
        items:
          $ref: '#/definitions/FieldError'
    description: For 422 VALIDATION_FAILED, fieldErrors MUST contain at least one item, with precise field 
      paths. For specific semantic 422 codes (e.g. INVALID_INVITE_CODE), fieldErrors is optional. Never echo 
      secrets or tokens. Same metadata envelope as ApiError.
  UUID:
    type: string
    format: uuid
  Username:
    type: string
    minLength: 3
    maxLength: 32
    pattern: ^[a-zA-Z0-9_.-]+$
  Password:
    type: string
    format: password
    minLength: 8
    maxLength: 128
  Email:
    type: string
    format: email
    maxLength: 254
  Slug:
    type: string
    minLength: 3
    maxLength: 64
    pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
  TeamName:
    type: string
    minLength: 3
    maxLength: 64
    pattern: ^[^\x00-\x1F/\\]{3,64}$
    description: Unicode allowed; slash, backslash and control characters are forbidden.
  ParticipationMode:
    type: string
    enum:
    - INDIVIDUAL
    - TEAM
  RegistrationMode:
    type: string
    enum:
    - OPEN
    - INVITE_ONLY
    - CLOSED
  BoardStatus:
