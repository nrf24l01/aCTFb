    required:
    - email
    - username
    - password
    additionalProperties: false
    properties:
      email:
        $ref: '#/definitions/Email'
      username:
        $ref: '#/definitions/Username'
      password:
        $ref: '#/definitions/Password'
  TokenResponse:
    type: object
    required:
    - accessToken
    - tokenType
    - expiresIn
    additionalProperties: false
    properties:
      accessToken:
        type: string
        minLength: 20
      tokenType:
        type: string
        enum:
        - Bearer
      expiresIn:
        type: integer
        minimum: 1
  RegisterResponse:
    allOf:
