    - type: object
      required:
      - emailVerified
      - user
      properties:
        emailVerified:
          type: boolean
        user:
          $ref: '#/definitions/Me'
  LoginResponse:
    allOf:
    - $ref: '#/definitions/TokenResponse'
    - type: object
      required:
      - user
      properties:
        user:
          $ref: '#/definitions/Me'
  PasswordResetRequest:
    type: object
    required:
    - email
    additionalProperties: false
    properties:
      email:
        $ref: '#/definitions/Email'
  PasswordResetConfirmRequest:
    type: object
    required:
