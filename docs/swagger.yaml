      required:
      - description
      - visibility
      properties:
        description:
          type: string
          maxLength: 50000
        visibility:
          $ref: '#/definitions/BoardVisibility'
  BoardJoinRequest:
    type: object
    additionalProperties: false
    properties:
      inviteCode:
        type: string
        minLength: 8
        maxLength: 128
    x-validation-rules:
    - inviteCode is required for INVITE_ONLY and must be omitted for OPEN
  Team:
    type: object
    required:
    - uuid
    - boardUuid
    - name
    - captainUuid
    - membersCount
    - maxMembers
    additionalProperties: false
    properties:
      uuid:
        $ref: '#/definitions/UUID'
      boardUuid:
        $ref: '#/definitions/UUID'
      name:
        $ref: '#/definitions/TeamName'
      captainUuid:
        $ref: '#/definitions/UUID'
      membersCount:
        type: integer
        minimum: 1
      maxMembers:
        type: integer
        minimum: 1
  TeamCreateRequest:
    type: object
    required:
    - name
    additionalProperties: false
    properties:
      name:
        $ref: '#/definitions/TeamName'
  TeamPatchRequest:
    type: object
    minProperties: 1
