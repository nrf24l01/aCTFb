swagger: '2.0'
info:
  title: aCTFb Universal Board API
  version: 2.1.0
  description: Universal security competition/training board API. Supports TASKS, ATTACK_DEFENSE and PENTEST boards. Scoring
    is always enabled; rating.visibility controls only whether participants may see the global rating/place. Binary content
    is never proxied through the API and there is no generic upload API. Presigned S3-compatible uploads exist only inside
    an authorized TASK or PENTEST context (participant submission draft or admin attachment scope). All object-storage buckets
    are private; presigned URLs are short-lived and context-bound. Unless stated otherwise, every non-2xx response returns
    ApiError or ValidationError.
basePath: /api/v2
tags:
- name: Auth
- name: Me
- name: Boards
- name: Teams
- name: Rating
- name: Tasks
- name: Task Files
- name: Task Instances
- name: Attack Defense
- name: Pentest
- name: Pentest Files
- name: Webhooks
- name: Admin Users
- name: Admin Access Groups
- name: Admin Boards
- name: Admin Participants
- name: Admin Teams
- name: Admin Rating
- name: Admin Submissions
- name: Admin Tasks
- name: Admin Task Files
- name: Admin Attack Defense
- name: Admin Pentest
- name: Admin Pentest Files
- name: Admin Instances
- name: Admin Integrations
- name: Admin Audit
security:
- bearerAuth: []
paths:
  /auth/register:
    post:
      tags:
      - Auth
      summary: Register
      operationId: register
      security: []
      x-error-codes:
        '409':
        - EMAIL_ALREADY_EXISTS
        - USERNAME_ALREADY_EXISTS
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      x-response-headers:
      - 'Cache-Control: no-store'
      - 'Pragma: no-cache'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/RegisterRequest'
      responses:
        '201':
          description: Registered; refresh token is set in HttpOnly cookie.
          headers:
            Set-Cookie:
              type: string
          schema:
            $ref: '#/definitions/RegisterResponse'
        '409':
          $ref: '#/responses/Conflict'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: login
      security: []
      x-error-codes:
        '401':
        - INVALID_CREDENTIALS
        '403':
        - USER_DISABLED
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      x-security-controls:
      - Rate-limit by normalized account identifier and source network; do not log password or access/refresh tokens.
      - Use constant-time password verification path and a generic INVALID_CREDENTIALS response for unknown user/wrong password.
      x-response-headers:
      - 'Cache-Control: no-store'
      - 'Pragma: no-cache'
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/LoginRequest'
      responses:
        '200':
          description: Login successful; refresh token is set in HttpOnly cookie.
          headers:
            Set-Cookie:
              description: 'Rotating refresh token cookie: HttpOnly; Secure; Path=/api/v2/auth; SameSite=Strict where deployment
                topology permits.'
              type: string
          schema:
            $ref: '#/definitions/LoginResponse'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Refresh access token
      operationId: refreshToken
      security:
      - refreshCookie: []
      x-error-codes:
        '401':
        - REFRESH_TOKEN_MISSING
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_EXPIRED
        '403':
        - USER_DISABLED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      x-security-controls:
      - Refresh cookie is HttpOnly + Secure and scoped to /api/v2/auth.
      - Validate Origin/Referer against allowed frontend origins before using cookie credentials.
      - Refresh tokens are one-time rotating tokens; reuse detection revokes the token family.
      x-response-headers:
      - 'Cache-Control: no-store'
      - 'Pragma: no-cache'
      responses:
        '200':
          description: New access token.
          schema:
            $ref: '#/definitions/TokenResponse'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: logout
      security:
      - refreshCookie: []
      x-security-controls:
      - Refresh cookie is HttpOnly + Secure and scoped to /api/v2/auth.
      - Validate Origin/Referer against allowed frontend origins before using cookie credentials.
      - Refresh tokens are one-time rotating tokens; reuse detection revokes the token family.
      responses:
        '204':
          description: Refresh cookie invalidated and cleared.
        '500':
          $ref: '#/responses/InternalError'
  /auth/password-reset/request:
    post:
      tags:
      - Auth
      summary: Request password reset
      operationId: requestPasswordReset
      security: []
      x-error-codes:
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/PasswordResetRequest'
      responses:
        '202':
          description: Accepted. Response never reveals whether email exists.
          schema:
            $ref: '#/definitions/StatusResponse'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /auth/password-reset/confirm:
    post:
      tags:
      - Auth
      summary: Confirm password reset
      operationId: confirmPasswordReset
      security: []
      x-error-codes:
        '400':
        - RESET_TOKEN_INVALID
        '410':
        - RESET_TOKEN_EXPIRED
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/PasswordResetConfirmRequest'
      responses:
        '200':
          description: Password changed.
          schema:
            $ref: '#/definitions/StatusResponse'
        '400':
          $ref: '#/responses/BadRequest'
        '410':
          $ref: '#/responses/Gone'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /auth/email-verification/request:
    post:
      tags:
      - Auth
      summary: Request email verification
      operationId: requestEmailVerification
      x-error-codes:
        '401':
        - UNAUTHORIZED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      responses:
        '202':
          description: Accepted.
          schema:
            $ref: '#/definitions/StatusResponse'
        '401':
          $ref: '#/responses/Unauthorized'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
  /auth/email-verification/confirm:
    post:
      tags:
      - Auth
      summary: Confirm email verification
      operationId: confirmEmailVerification
      security: []
      x-error-codes:
        '400':
        - VERIFICATION_TOKEN_INVALID
        '410':
        - VERIFICATION_TOKEN_EXPIRED
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/EmailVerificationConfirmRequest'
      responses:
        '200':
          description: Email verified.
          schema:
            $ref: '#/definitions/StatusResponse'
        '400':
          $ref: '#/responses/BadRequest'
        '410':
          $ref: '#/responses/Gone'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /me:
    get:
      tags:
      - Me
      summary: Current user
      operationId: getMe
      responses:
        '200':
          description: Current user.
          schema:
            $ref: '#/definitions/Me'
        '401':
          $ref: '#/responses/Unauthorized'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
    patch:
      tags:
      - Me
      summary: Update current user
      operationId: updateMe
      x-error-codes:
        '409':
        - USERNAME_ALREADY_EXISTS
        '422':
        - VALIDATION_FAILED
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/MePatchRequest'
      responses:
        '200':
          description: Updated user.
          schema:
            $ref: '#/definitions/Me'
        '401':
          $ref: '#/responses/Unauthorized'
        '409':
          $ref: '#/responses/Conflict'
        '422':
          $ref: '#/responses/ValidationFailed'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /me/password:
    post:
      tags:
      - Me
      summary: Change password
      operationId: changeMyPassword
      x-error-codes:
        '400':
        - INVALID_CREDENTIALS
        '422':
        - VALIDATION_FAILED
        '429':
        - RATE_LIMITED
      parameters:
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/responses/BadRequest'
        '401':
          $ref: '#/responses/Unauthorized'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
  /boards:
    get:
      tags:
      - Boards
      summary: List visible boards
      operationId: listBoards
      parameters:
      - $ref: '#/parameters/LimitParam'
      - $ref: '#/parameters/OffsetParam'
      - $ref: '#/parameters/QueryParam'
      - name: mode
        in: query
        type: string
        enum:
        - TASKS
        - ATTACK_DEFENSE
        - PENTEST
      - name: status
        in: query
        type: string
        enum:
        - DRAFT
        - SCHEDULED
        - ACTIVE
        - FINISHED
        - ARCHIVED
      - name: participationMode
        in: query
        type: string
        enum:
        - INDIVIDUAL
        - TEAM
      responses:
        '200':
          description: Visible boards.
          schema:
            $ref: '#/definitions/BoardListResponse'
        '401':
          $ref: '#/responses/Unauthorized'
        '422':
          $ref: '#/responses/ValidationFailed'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
  /boards/{boardUuid}:
    get:
      tags:
      - Boards
      summary: Board details
      operationId: getBoard
      x-error-codes:
        '403':
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
        '422':
        - VALIDATION_FAILED
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      responses:
        '200':
          description: Board details.
          schema:
            $ref: '#/definitions/Board'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '422':
          $ref: '#/responses/ValidationFailed'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
  /boards/{boardUuid}/join:
    post:
      tags:
      - Boards
      summary: Join board
      operationId: joinBoard
      x-error-codes:
        '403':
        - BOARD_REGISTRATION_CLOSED
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
        '409':
        - ALREADY_JOINED
        - BOARD_FINISHED
        '422':
        - INVALID_INVITE_CODE
        - VALIDATION_FAILED
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/BoardJoinRequest'
      responses:
        '200':
          description: Joined board.
          schema:
            $ref: '#/definitions/BoardMe'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '422':
          $ref: '#/responses/ValidationFailed'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /boards/{boardUuid}/leave:
    post:
      tags:
      - Boards
      summary: Leave board
      operationId: leaveBoard
      x-error-codes:
        '403':
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
        '409':
        - BOARD_NOT_JOINED
        - BOARD_LEAVE_NOT_ALLOWED
        - TEAM_CAPTAIN_MUST_TRANSFER
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      responses:
        '204':
          description: Left board.
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '500':
          $ref: '#/responses/InternalError'
  /boards/{boardUuid}/me:
    get:
      tags:
      - Boards
      summary: My participation state
      operationId: getBoardMe
      x-error-codes:
        '403':
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      responses:
        '200':
          description: Participation, own score and place. place is null when rating is hidden.
          schema:
            $ref: '#/definitions/BoardMe'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
  /boards/{boardUuid}/team:
    get:
      tags:
      - Teams
      summary: My team
      operationId: getMyTeam
      x-error-codes:
        '403':
        - WRONG_BOARD_MODE
        - BOARD_ACCESS_DENIED
        '404':
        - TEAM_NOT_FOUND
        - BOARD_NOT_FOUND
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      responses:
        '200':
          description: Current team.
          schema:
            $ref: '#/definitions/Team'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
    patch:
      tags:
      - Teams
      summary: Update my team
      operationId: updateMyTeam
      x-error-codes:
        '403':
        - TEAM_CAPTAIN_REQUIRED
        - BOARD_TEAM_CHANGES_LOCKED
        '404':
        - TEAM_NOT_FOUND
        '409':
        - TEAM_NAME_ALREADY_EXISTS
        '422':
        - VALIDATION_FAILED
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/TeamPatchRequest'
      responses:
        '200':
          description: Updated team.
          schema:
            $ref: '#/definitions/Team'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '422':
          $ref: '#/responses/ValidationFailed'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /boards/{boardUuid}/teams:
    post:
      tags:
      - Teams
      summary: Create team
      operationId: createTeam
      x-error-codes:
        '403':
        - WRONG_BOARD_MODE
        - TEAM_CREATION_DISABLED
        - BOARD_ACCESS_DENIED
        '404':
        - BOARD_NOT_FOUND
        '409':
        - USER_ALREADY_IN_TEAM
        - TEAM_NAME_ALREADY_EXISTS
        - BOARD_NOT_JOINED
        '422':
        - VALIDATION_FAILED
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/TeamCreateRequest'
      responses:
        '201':
          description: Team created.
          schema:
            $ref: '#/definitions/Team'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '422':
          $ref: '#/responses/ValidationFailed'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /boards/{boardUuid}/teams/join:
    post:
      tags:
      - Teams
      summary: Join team
      operationId: joinTeam
      x-error-codes:
        '403':
        - WRONG_BOARD_MODE
        - BOARD_TEAM_CHANGES_LOCKED
        '404':
        - TEAM_NOT_FOUND
        - BOARD_NOT_FOUND
        '409':
        - TEAM_FULL
        - USER_ALREADY_IN_TEAM
        '422':
        - INVALID_TEAM_INVITE_KEY
        - VALIDATION_FAILED
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/TeamJoinRequest'
      responses:
        '200':
          description: Joined team.
          schema:
            $ref: '#/definitions/Team'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '422':
          $ref: '#/responses/ValidationFailed'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
      - application/json
      produces:
      - application/json
  /boards/{boardUuid}/team/invite-key:
    get:
      tags:
      - Teams
      summary: Get team invite key
      operationId: getTeamInviteKey
      x-error-codes:
        '403':
        - TEAM_CAPTAIN_REQUIRED
        '404':
        - TEAM_NOT_FOUND
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      responses:
        '200':
          description: Invite key.
          schema:
            $ref: '#/definitions/TeamInviteResponse'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
  /boards/{boardUuid}/team/invite-key/rotate:
    post:
      tags:
      - Teams
      summary: Rotate team invite key
      operationId: rotateTeamInviteKey
      x-error-codes:
        '403':
        - TEAM_CAPTAIN_REQUIRED
        '404':
        - TEAM_NOT_FOUND
        '409':
        - BOARD_TEAM_CHANGES_LOCKED
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      responses:
        '200':
          description: New invite key.
          schema:
            $ref: '#/definitions/TeamInviteResponse'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '500':
          $ref: '#/responses/InternalError'
      produces:
      - application/json
  /boards/{boardUuid}/team/leave:
    post:
      tags:
      - Teams
      summary: Leave team
      operationId: leaveTeam
      x-error-codes:
        '404':
        - TEAM_NOT_FOUND
        '409':
        - TEAM_CAPTAIN_MUST_TRANSFER
        - BOARD_TEAM_CHANGES_LOCKED
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      responses:
        '204':
          description: Left team.
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '500':
          $ref: '#/responses/InternalError'
  /boards/{boardUuid}/team/members/{userUuid}:
    delete:
      tags:
      - Teams
      summary: Remove team member
      operationId: removeTeamMember
      x-error-codes:
        '403':
        - TEAM_CAPTAIN_REQUIRED
        '404':
        - TEAM_MEMBER_NOT_FOUND
        '409':
        - BOARD_TEAM_CHANGES_LOCKED
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      - $ref: '#/parameters/UserUuidParam'
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '500':
          $ref: '#/responses/InternalError'
  /boards/{boardUuid}/team/captain:
    post:
      tags:
      - Teams
      summary: Transfer team captain
      operationId: transferTeamCaptain
      x-error-codes:
        '403':
        - TEAM_CAPTAIN_REQUIRED
        '404':
        - TEAM_MEMBER_NOT_FOUND
        '409':
        - BOARD_TEAM_CHANGES_LOCKED
        '422':
        - VALIDATION_FAILED
      parameters:
      - $ref: '#/parameters/BoardUuidParam'
      - name: body
        in: body
        required: true
        schema:
          $ref: '#/definitions/TransferCaptainRequest'
      responses:
        '200':
          description: Updated team.
          schema:
            $ref: '#/definitions/Team'
        '401':
          $ref: '#/responses/Unauthorized'
        '403':
          $ref: '#/responses/Forbidden'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '422':
          $ref: '#/responses/ValidationFailed'
        '500':
          $ref: '#/responses/InternalError'
      consumes:
