  FileValidationStatus:
    type: string
    enum:
    - AWAITING_UPLOAD
    - VALIDATING
    - READY
    - REJECTED
    - ATTACHED
    - EXPIRED
  SubmissionDraftStatus:
    type: string
    enum:
    - OPEN
    - CONSUMED
    - EXPIRED
  PendingFile:
    allOf:
    - $ref: '#/definitions/FileRef'
    - type: object
      required:
      - status
      properties:
        status:
          $ref: '#/definitions/FileValidationStatus'
        rejectionCode:
          type: string
          x-nullable: true
          maxLength: 128
          description: Machine-readable reason when status=REJECTED. No malware/signature internals are exposed.
    description: Logical file metadata plus quarantine/validation state. Only READY files may be finalized; ATTACHED files
      are immutable. REJECTED/EXPIRED quarantine objects are never downloadable.
  ScopedFilePresignRequest:
    type: object
    required:
    - filename
    - contentType
    - size
    - sha256
    additionalProperties: false
    description: The client supplies only immutable file metadata. Context/purpose, owner, S3 key, limits and allowed types
      are derived from the TASK/PENTEST resource and cannot be selected by the client.
    properties:
      filename:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[^/\\\x00-\x1F]+$
      contentType:
        type: string
        minLength: 1
        maxLength: 255
      size:
        type: integer
        minimum: 1
        maximum: 1073741824
      sha256:
        type: string
        pattern: ^[A-Fa-f0-9]{64}$
        description: SHA-256 of the exact bytes to be uploaded.
    x-validation-rules:
    - filename must be a base name only and contain no slash, backslash, NUL or control characters
    - effective max size and MIME allow-list come from the task/pentest attachment or submission policy
    - declared MIME is advisory; detected type/magic is checked after upload
  ScopedFilePresignResponse:
    type: object
    required:
    - fileUuid
    - method
    - uploadUrl
    - requiredHeaders
    - expiresAt
    additionalProperties: false
    properties:
      fileUuid:
        $ref: '#/definitions/UUID'
      method:
        type: string
        enum:
        - PUT
      uploadUrl:
        type: string
        format: uri
      requiredHeaders:
        type: object
        additionalProperties:
          type: string
        description: Signed headers that must be sent exactly as returned. Typically includes Content-Type and checksum; deployment
          may also sign a create-only conditional header and server-side encryption requirements.
      expiresAt:
        type: string
        format: date-time
    x-security-controls:
    - URL is bound to exactly one server-generated object key and cannot upload another key
    - URL expires quickly and cannot be refreshed outside the original authorized resource context
    - bucket is private and public ACL/object ownership changes are forbidden by bucket policy
    - Upload target is quarantine-only; this URL can never address a clean/attached object directly.
    - The backend stores/pins the validated object version (or server-side copies it to immutable clean storage) before status
      becomes READY.
  SubmissionDraft:
    type: object
    required:
    - uuid
    - status
    - createdAt
    - expiresAt
    - files
    additionalProperties: false
    properties:
      uuid:
        $ref: '#/definitions/UUID'
      status:
        $ref: '#/definitions/SubmissionDraftStatus'
      createdAt:
        type: string
        format: date-time
      expiresAt:
        type: string
        format: date-time
      files:
        type: array
        maxItems: 100
        items:
          $ref: '#/definitions/PendingFile'
    description: Short-lived, caller-bound upload context. Even members of the same team cannot read/finalize another member's
      draft. Finalization atomically consumes the draft.
  FinalizeSubmissionRequest:
    type: object
    additionalProperties: false
    properties:
      text:
        type: string
        maxLength: 1000000
      draftUuid:
        $ref: '#/definitions/UUID'
    x-validation-rules:
    - Presence/limits of text are validated against SubmissionPolicy.
    - If files are required or supplied by policy, draftUuid is required; raw file UUIDs are never accepted.
    - draftUuid must belong to the authenticated caller, same board and same task/pentest context, be OPEN and unexpired.
    - Every draft file must be READY; VALIDATING/REJECTED files block finalization.
    - Finalization atomically marks files ATTACHED and draft CONSUMED before score/checker side effects are committed.
  AdminSubmissionReviewDecision:
    type: string
    enum:
    - ACCEPT
    - REJECT
  AdminSubmissionReviewRequest:
    type: object
    required:
    - decision
    additionalProperties: false
    properties:
      decision:
        $ref: '#/definitions/AdminSubmissionReviewDecision'
      message:
        type: string
        maxLength: 2000
        x-nullable: true
    description: Manual review changes acceptance only. Arbitrary score overrides are not allowed here; use the audited score-adjustment
      endpoint for exceptional corrections.
  SubmissionResourceType:
    type: string
    enum:
    - TASK
    - PENTEST
  AdminSubmission:
    allOf:
    - $ref: '#/definitions/Submission'
    - type: object
      required:
      - resourceType
      - boardUuid
      - subject
      properties:
        resourceType:
          $ref: '#/definitions/SubmissionResourceType'
        boardUuid:
          $ref: '#/definitions/UUID'
        taskUuid:
          allOf:
          - $ref: '#/definitions/UUID'
          x-nullable: true
        subject:
          $ref: '#/definitions/ScoreSubject'
        submittedByUserUuid:
          $ref: '#/definitions/UUID'
  AdminSubmissionListResponse:
    type: object
    required:
    - items
    - limit
    - offset
    - total
    additionalProperties: false
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/AdminSubmission'
      limit:
        type: integer
        minimum: 1
      offset:
        type: integer
        minimum: 0
      total:
        type: integer
        minimum: 0
  InstancePublicationPolicy:
    type: object
    additionalProperties: false
    properties:
      publicTcpHost:
        type: string
        minLength: 1
        maxLength: 255
        description: Fixed public FQDN/IP advertised for TCP/UDP mappings.
      publicPortFrom:
        type: integer
        minimum: 1
        maximum: 65535
      publicPortTo:
        type: integer
        minimum: 1
        maximum: 65535
      httpBaseDomain:
        type: string
        minLength: 1
        maxLength: 253
        description: Trusted DNS suffix used by the platform to generate per-instance HTTP hostnames.
      forceHttps:
        type: boolean
        default: true
    x-validation-rules:
    - publicPortTo must be >= publicPortFrom
    - Task/pentest configs cannot override public host suffix or public port range.
    - Generated hostnames must remain under the configured trusted suffix and must not accept arbitrary user input.
x-security-baseline:
  transport:
  - Production deployments MUST use HTTPS/TLS only.
  - Access tokens MUST NOT be accepted from query parameters.
  authentication:
  - Access JWTs SHOULD be short-lived (recommended <= 15 minutes).
  - Refresh tokens MUST rotate on every refresh; detected token reuse revokes the whole refresh-token family.
  - Refresh cookies MUST be HttpOnly, Secure and scoped to /api/v2/auth; SameSite=Strict is recommended where deployment topology
    permits.
  - Refresh/logout endpoints MUST validate Origin/Referer against the configured frontend origins.
  authorization:
  - Every resource lookup MUST enforce board membership/ACL and resource ownership in the same authorization decision; UUID
    knowledge never grants access.
  - TEAM-scoped resources derive the active team from authenticated membership; clients never choose an arbitrary owner UUID.
  - All /admin operations require ADMIN role in addition to a valid bearer token.
  files:
  - No generic upload or download endpoints exist.
  - S3/object-storage buckets MUST have public access blocked; object keys are server-generated random identifiers and never
    client-selected.
  - Presigned upload URLs MUST target exactly one object key, expire quickly (recommended <= 5 minutes), and bind expected
    Content-Type and checksum.
  - Completion MUST verify object existence, exact size, SHA-256 checksum, configured MIME allow-list, detected file type/magic
    and security scan result before READY.
  - Archives that are unpacked MUST be checked for path traversal, symlinks, excessive expansion and file-count limits.
  - Presigned download URLs MUST be authorized at request time, short-lived (recommended <= 60 seconds), and use attachment
    disposition on an isolated download origin.
  - Submission files become immutable after finalization and cannot be re-used by another submission or context.
  - Uploads MUST land in a non-public quarantine namespace/bucket. Quarantine objects are never downloadable by participants.
  - READY is set only for the exact validated object version; preferably copy the validated bytes server-side into an immutable
    clean namespace and reference only that clean object/version.
  - Presigned PUT should be create-only where supported (for example a signed conditional write) so the same URL cannot overwrite
    an already uploaded object.
  - Orphaned drafts/quarantine objects MUST have short lifecycle cleanup and must not be attachable after draft expiry.
  concurrency:
  - Quota checks and state transitions for instances/submissions MUST be atomic.
  - Operations that may be retried use Idempotency-Key to prevent duplicate scoring/provisioning.
  secrets:
  - Integration credentials, accepted answers, hidden tests and provider secrets are write-only and never returned or logged.
  - Participant endpoint credentials are returned only to the owning subject when explicitly configured as visible.
  networking:
  - Public endpoint hostnames/ports are generated only from the selected PROXMOX/CONTAINER integration publication policy;
    task/pentest configs cannot inject arbitrary public hosts.
  - HTTP reverse proxies must route by an allow-listed generated hostname and must not trust participant-supplied Host/X-Forwarded-*
    headers for provisioning decisions.
  - PRIVATE endpoint addresses are returned only when the board topology intentionally exposes them to the owning subject.
  external_integrations:
  - Integration base URLs are admin-only and MUST be validated against an explicit deployment allow-list or SSRF policy before
    any server-side connection.
  - Reject/allow-list loopback, link-local, cloud metadata, Unix socket and unexpected private-network destinations; re-check
    redirects and resolved addresses to prevent DNS rebinding.
  - Git repository fields are provider-native repository identifiers, not arbitrary clone URLs.
  - Runner/container images should come from trusted registries and be pinned by immutable digest for competition-critical
    workloads.
x-response-security-headers:
  sensitiveResponses:
  - 'Cache-Control: no-store'
  - 'Pragma: no-cache'
  downloads:
  - 'Content-Disposition: attachment'
  - 'X-Content-Type-Options: nosniff'
  browserApi:
  - Content-Security-Policy is enforced by the frontend/application origin; presigned download content is served from a separate
    non-cookie origin.
