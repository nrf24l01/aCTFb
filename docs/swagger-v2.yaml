  DraftUuidParam:
    name: draftUuid
    in: path
    required: true
    type: string
    format: uuid
  IdempotencyKeyParam:
    name: Idempotency-Key
    in: header
    required: true
    description: Client-generated key used to make this state-changing operation retry-safe. Same key + same principal + same
      route must produce the same logical result; reuse with a different payload returns 409 IDEMPOTENCY_KEY_REUSED.
    type: string
    minLength: 16
    maxLength: 128
    pattern: ^[A-Za-z0-9._:-]+$
