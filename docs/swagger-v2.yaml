  /webhooks/git/{repositoryBindingUuid}:
    post:
      tags:
      - Webhooks
      summary: Git push webhook
      operationId: gitWebhook
      description: Authenticates provider-specific signature over raw bytes, enforces body limit/freshness, deduplicates delivery
        ID, validates repository+branch/event against stored binding, and only then enqueues PATCH/EXPLOIT run.
      security:
      - gitWebhookSignature: []
      x-error-codes:
        '400':
        - INVALID_WEBHOOK_PAYLOAD
        '401':
        - INVALID_WEBHOOK_SIGNATURE
        - WEBHOOK_STALE
        '404':
        - REPOSITORY_BINDING_NOT_FOUND
        '409':
        - WEBHOOK_ALREADY_PROCESSED
        - WEBHOOK_REPLAYED
        '422':
        - UNSUPPORTED_GIT_EVENT
        '429':
        - RATE_LIMITED
        '500':
        - INTERNAL_ERROR
        '413':
        - PAYLOAD_TOO_LARGE
      x-security-controls:
      - Verify HMAC/signature over raw request bytes before JSON parsing/processing.
      - Enforce configured maximum body size before parsing.
      - Reject stale timestamps when provider supplies signed timestamps.
      - Deduplicate provider delivery/event ID using a durable unique constraint to prevent replay.
      - Verify repository/project identity and allowed branch/ref against the stored binding; do not trust path UUID alone.
      - Never fetch arbitrary callback URLs from webhook payloads.
      parameters:
      - $ref: '#/parameters/RepositoryBindingUuidParam'
      - name: body
        in: body
        required: true
        schema:
          type: object
          additionalProperties: true
      responses:
        '202':
          description: Webhook accepted.
          schema:
            $ref: '#/definitions/StatusResponse'
        '400':
          $ref: '#/responses/BadRequest'
        '401':
          $ref: '#/responses/Unauthorized'
        '404':
          $ref: '#/responses/NotFound'
        '409':
          $ref: '#/responses/Conflict'
        '422':
          $ref: '#/responses/ValidationFailed'
        '429':
          $ref: '#/responses/RateLimited'
        '500':
          $ref: '#/responses/InternalError'
        '413':
          $ref: '#/responses/PayloadTooLarge'
      consumes:
      - application/json
      produces:
      - application/json
