name: CI

# Required: Go 1.27.1, Docker Engine/Compose v2, Bun 1.4.4, and GitHub Actions
# access to GHCR. Pull requests test and build images without pushing. Publish
# is main-only and manual-main-only; it never runs for PRs.
on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "email_templates/**"
      - "api/proto/**"
      - "frontend/**"
      - "e2e/**"
      - "scripts/**"
      - "Dockerfile"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "frontend/.dockerignore"
      - "frontend/realip.conf"
      - "docker-bake.hcl"
      - ".dockerignore"
      - "config.dev.yml"
      - "docker-compose.dev.yaml"
      - "deploy/compose.yaml"
      - "deploy/config.yaml"
      - "deploy/.env.example"
      - "deploy/realip.conf"
      - "Makefile"
      - ".air.toml"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "email_templates/**"
      - "api/proto/**"
      - "frontend/**"
      - "e2e/**"
      - "scripts/**"
      - "Dockerfile"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - "frontend/.dockerignore"
      - "frontend/realip.conf"
      - "docker-bake.hcl"
      - ".dockerignore"
      - "config.dev.yml"
      - "docker-compose.dev.yaml"
      - "deploy/compose.yaml"
      - "deploy/config.yaml"
      - "deploy/.env.example"
      - "deploy/realip.conf"
      - "Makefile"
      - ".air.toml"
      - ".github/workflows/go.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Serialize runs instead of cancelling one half of a publish pair.
  cancel-in-progress: false

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test all packages
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Build all commands and packages
        run: go build ./...

      - name: Race detector
        run: go test -race ./... -count=1

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Unit tests
        working-directory: frontend
        run: bun run test

      - name: Build frontend bundle
        working-directory: frontend
        run: bun run build

  integration:
    name: Integration
    # Independent of the quality jobs on purpose. This job checks out, installs
    # Go and Bun, and builds the ten images itself, so it consumes no artifact
    # from `backend` or `frontend`; the old `needs` only serialised it behind
    # them and left ~3m of the runner idle on a green commit. The trade-off is
    # that a quality failure is reported after integration has already started,
    # which costs runner minutes on a red commit but never delays the verdict.
    # `publish` still needs all three jobs, so nothing is pushed unless every
    # gate passes.
    runs-on: ubuntu-latest
    # Raised from 75 after the default-profile browser suite was added: the
    # serial Docker full-stack run (~40m), the isolated integration tests and the
    # real-PostgreSQL packages legitimately exceed the old budget. The job count
    # stays at four.
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: actfb_ci
          POSTGRES_PASSWORD: actfb_ci_ephemeral
          POSTGRES_DB: actfb_ci
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U actfb_ci -d actfb_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "56379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ACTFB_TEST_POSTGRES_DSN: postgres://actfb_ci:actfb_ci_ephemeral@127.0.0.1:55432/actfb_ci?sslmode=disable
      ACTFB_TEST_DATABASE_URL: postgres://actfb_ci:actfb_ci_ephemeral@127.0.0.1:55432/actfb_ci?sslmode=disable
      ACTFB_TEST_REDIS_ADDR: 127.0.0.1:56379
      ACTFB_TEST_REDIS_DB: "0"
      ACTFB_P0_INTEGRATION: "1"
      ACTFB_P1_INTEGRATION: "1"
      ACTFB_RUSTFS_INTEGRATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Apply migrations to a clean schema
        run: go test ./internal/platform/postgres -run TestMigrationsCleanSchema -count=1 -v

      # Includes the 020 board_join_codes down/up subtest. Migration regressions
      # are the kind of thing a `-run TestP1R` selection silently skips.
      - name: Run migration backfill and down/up acceptance
        run: go test ./internal/platform/postgres -run 'TestMigrationsRemainingStages' -count=1 -v -timeout 15m

      - name: Run real PostgreSQL auth integration tests
        run: go test ./internal/users/... -run 'TestPostgres' -count=1 -v

      - name: Run real PostgreSQL backend admin CLI tests
        run: go test ./internal/admincli -run 'TestPostgres' -count=1 -v -timeout 10m

      - name: Run real PostgreSQL retention integration tests
        run: go test ./internal/authretention -run 'TestRun' -count=1 -v

      - name: Run real Redis limiter and client tests
        run: go test ./internal/platform/ratelimit ./internal/platform/redis -count=1 -v

      # Whole affected packages with the DSN, not a brittle `-run` selection.
      # This is what gates the staff-preview, code-only enrollment, instance
      # participant-ABAC and default-profile catalog regressions: those tests skip
      # without ACTFB_TEST_POSTGRES_DSN, so the DSN-less backend job cannot see
      # them. The P1R acceptance tests live in ./internal/boards and
      # ./internal/boards/http, so they still run (coverage is not reduced).
      - name: Run real PostgreSQL domain, HTTP and boot acceptance
        run: >-
          go test
          ./internal/boards/...
          ./internal/access/...
          ./internal/authorization/...
          ./internal/deployment/...
          ./internal/instances/...
          ./internal/integrations/...
          ./internal/plugins/...
          ./internal/attackdefense/...
          ./internal/files/...
          ./internal/platform/postgres/...
          ./cmd/backend/...
          -count=1 -timeout 40m

      - name: Run isolated P0 integration smoke
        run: go test ./internal/integration -run TestP0AuthEmailIntegration -count=1 -v -timeout 10m

      - name: Run isolated P1 HTTP integration
        run: go test ./internal/integration -run TestP1CoreIntegration -count=1 -v -timeout 35m

      - name: Run isolated RustFS full-stack integration
        timeout-minutes: 40
        run: go test ./internal/integration -run TestRustFSFullStackIntegration -count=1 -v -timeout 30m

      - name: Set up Bun for browser acceptance
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Playwright dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile

      # The default-profile browser run serves the app from a Vite dev server, so
      # it needs the frontend dependencies. Installing them here keeps that a
      # visible, cached step instead of an implicit install inside the script.
      - name: Install frontend dependencies for the browser acceptance
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run real-browser acceptance
        timeout-minutes: 40
        env:
          E2E_OUTPUT_DIR: ${{ github.workspace }}/e2e/test-results/p1-core
          E2E_REPORT_DIR: ${{ github.workspace }}/e2e/playwright-report/p1-core
        run: ./e2e/run-e2e.sh p1-core.spec.ts

      # The full-stack suite forces every optional feature on, which is exactly
      # how the default-profile regressions escaped. This run boots the real
      # backend with deployment/integrations/plugins/files/A+D disabled and no
      # credential key, then drives Chromium through staff preview, the empty
      # template catalog and code-only enrollment.
      - name: Run default-profile browser acceptance
        timeout-minutes: 20
        env:
          E2E_PG_DSN: ${{ env.ACTFB_TEST_POSTGRES_DSN }}
        run: ./e2e/run-default-profile-e2e.sh

      # Coverage gate, not a speed optimisation: these are the specs the default
      # `run-e2e.sh` collects and then skips because they require
      # E2E_FULL_STACK=1. The runner owns its ephemeral PostgreSQL/NATS/RustFS/
      # ClamAV/nginx fixtures and never touches operator data, so the extra
      # containers are CI-only. It costs wall clock and is expected to.
      - name: Run full-stack browser acceptance
        timeout-minutes: 45
        # Playwright artefacts are written into the workspace so the existing
        # `if: failure()` upload can collect them; the scratch workdir, which
        # holds the generated PostgreSQL credentials, is still deleted.
        env:
          E2E_OUTPUT_DIR: ${{ github.workspace }}/e2e/test-results/full-stack
          E2E_REPORT_DIR: ${{ github.workspace }}/e2e/playwright-report/full-stack
        run: ./e2e/run-full-e2e.sh full-stage.spec.ts organizer-ux.spec.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          # The shared `build` stage compiles the nine commands once; this bounds
          # how many of the ten image exports run at the same time so a 4-core
          # runner does not try to hold all ten layers in memory at once.
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2

      # Official action on purpose: `docker/bake-action` receives the Actions
      # cache credentials that a plain `run:` step does not, so the ten
      # `type=gha` scopes already declared in docker-bake.hcl are finally read
      # and written across runs. The tag overrides keep the `actfb-<target>:ci`
      # names that the packaging, runtime and auth/proxy smokes inspect, and the
      # bake is load-only and never pushes: every image stays on the runner.
      - name: Build all production images (no push)
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          source: .
          push: false
          load: true
          provenance: false
          set: |
            backend.tags=actfb-backend:ci
            notification.tags=actfb-notification:ci
            retention.tags=actfb-retention:ci
            events-dispatcher.tags=actfb-events-dispatcher:ci
            file-scanner.tags=actfb-file-scanner:ci
            storage-init.tags=actfb-storage-init:ci
            plugin-runner.tags=actfb-plugin-runner:ci
            ad-worker.tags=actfb-ad-worker:ci
            instance-worker.tags=actfb-instance-worker:ci
            frontend.tags=actfb-frontend:ci
        env:
          SHA_TAG: sha-${{ github.sha }}
          GIT_SHA: ${{ github.sha }}

      - name: Packaging contract checks
        env:
          ACTFB_TEST_IMAGES: "1"
          ACTFB_IMAGE_SUFFIX: ci
        run: ./scripts/test-production-packaging.sh

      # The two guard suites below are the regression tests for this pipeline
      # itself. They are pure text and need no service, so they run right after
      # the contract that they prove is live.
      - name: Test CI contract regression guards
        run: ./scripts/test-ci-contract.sh

      - name: Test test-resource cleanup guards
        run: ./e2e/test-run-cleanup.sh

      - name: Production image runtime smoke
        env:
          ACTFB_BACKEND_IMAGE: actfb-backend:ci
          ACTFB_FRONTEND_IMAGE: actfb-frontend:ci
          ACTFB_IMAGE_SUFFIX: ci
        run: ./scripts/test-production-runtime.sh

      - name: Production auth and proxy smoke
        env:
          ACTFB_IMAGE_SUFFIX: ci
        run: ./scripts/test-production-auth-proxy.sh

      - name: Upload failed browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-browser-artifacts
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish images
    needs: [backend, frontend, integration]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      REGISTRY: ghcr.io
      REPO: nrf24l01/actfb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish containers
        uses: docker/bake-action@v7
        env:
          LATEST_TAG: latest
          SHA_TAG: sha-${{ github.sha }}
          GIT_SHA: ${{ github.sha }}
        with:
          files: docker-bake.hcl
          source: .
          push: true
          provenance: false

      - name: Publish summary
        run: |
          set -euo pipefail
          immutable_tag="sha-${GITHUB_SHA}"
          images=(backend frontend notification retention events-dispatcher file-scanner storage-init plugin-runner ad-worker instance-worker)

          compressed_size() {
            local ref="$1"
            local raw
            raw="$(docker buildx imagetools inspect "$ref" --raw)"
            if jq -e '.manifests' >/dev/null 2>&1 <<<"$raw"; then
              local child
              child="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"$raw" | head -n1)"
              [[ -n "$child" && "$child" != "null" ]] && raw="$(docker buildx imagetools inspect "${ref%%:*}@${child}" --raw)"
            fi
            jq -r '([.layers[]?.size] | add) // "n/a"' <<<"$raw"
          }

          {
            echo "## Published containers"
            echo
            echo "| Image | Tags | Digest | Compressed size |"
            echo "| --- | --- | --- | --- |"
            for name in "${images[@]}"; do
              ref="${REGISTRY}/${REPO}-${name}"
              digest="$(docker buildx imagetools inspect "${ref}:${immutable_tag}" --format '{{json .Manifest}}' | jq -r '.digest')"
              size="$(compressed_size "${ref}:${immutable_tag}")"
              echo "| \`${ref}\` | \`latest\`, \`${immutable_tag}\` | \`${digest}\` | ${size} bytes |"
            done
            echo
            echo "Platform: \`linux/amd64\`."
          } >> "$GITHUB_STEP_SUMMARY"
