name: CI

# Required: Go 1.27.1, Docker Engine/Compose v2, Bun 1.4.4, and GitHub Actions
# access to GHCR. Pull requests test and build images without pushing. Publish
# is main-only and manual-main-only; it never runs for PRs.
on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "email_templates/**"
      - "api/proto/**"
      - "frontend/**"
      - "e2e/**"
      - "scripts/**"
      - "Dockerfile"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - ".dockerignore"
      - "config.dev.yml"
      - "config.prod.yml"
      - ".env.prod.example"
      - "docker-compose.dev.yaml"
      - "docker-compose.prod.yaml"
      - "Makefile"
      - ".air.toml"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "migrations/**"
      - "email_templates/**"
      - "api/proto/**"
      - "frontend/**"
      - "e2e/**"
      - "scripts/**"
      - "Dockerfile"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf"
      - ".dockerignore"
      - "config.dev.yml"
      - "config.prod.yml"
      - ".env.prod.example"
      - "docker-compose.dev.yaml"
      - "docker-compose.prod.yaml"
      - "Makefile"
      - ".air.toml"
      - ".github/workflows/go.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test all packages
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Build all commands and packages
        run: go build ./...

      - name: Race detector
        run: go test -race ./... -count=1

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: frontend
        run: bun run typecheck

      - name: Unit tests
        working-directory: frontend
        run: bun run test

      - name: Build frontend bundle
        working-directory: frontend
        run: bun run build

  integration:
    name: Integration
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: actfb_ci
          POSTGRES_PASSWORD: actfb_ci_ephemeral
          POSTGRES_DB: actfb_ci
        ports:
          - "55432:5432"
        options: >-
          --health-cmd "pg_isready -U actfb_ci -d actfb_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "56379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ACTFB_TEST_POSTGRES_DSN: postgres://actfb_ci:actfb_ci_ephemeral@127.0.0.1:55432/actfb_ci?sslmode=disable
      ACTFB_TEST_DATABASE_URL: postgres://actfb_ci:actfb_ci_ephemeral@127.0.0.1:55432/actfb_ci?sslmode=disable
      ACTFB_TEST_REDIS_ADDR: 127.0.0.1:56379
      ACTFB_TEST_REDIS_DB: "0"
      ACTFB_P0_INTEGRATION: "1"
      ACTFB_P1_INTEGRATION: "1"
      ACTFB_RUSTFS_INTEGRATION: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Apply migrations to a clean schema
        run: go test ./internal/platform/postgres -run TestMigrationsCleanSchema -count=1 -v

      - name: Run real PostgreSQL auth integration tests
        run: go test ./internal/users/... -run 'TestPostgres' -count=1 -v

      - name: Run real PostgreSQL retention integration tests
        run: go test ./internal/authretention -run 'TestRun' -count=1 -v

      - name: Run real Redis limiter and client tests
        run: go test ./internal/platform/ratelimit ./internal/platform/redis -count=1 -v

      - name: Run feature registry real PostgreSQL tests
        run: >-
          go test
          ./internal/access/...
          ./internal/authorization/...
          ./internal/integrations/...
          ./internal/plugins/...
          ./internal/attackdefense/...
          ./internal/deployment/...
          ./internal/files/...
          ./internal/instances/...
          -count=1 -timeout 20m

      - name: Run P1R real PostgreSQL acceptance
        run: go test ./internal/boards -run 'TestP1R' -count=1 -v -timeout 20m

      - name: Run P1R real HTTP handler acceptance
        run: go test ./internal/boards/http -run 'TestP1RHTTPRoutes' -count=1 -v -timeout 20m

      - name: Run isolated P0 integration smoke
        run: go test ./internal/integration -run TestP0AuthEmailIntegration -count=1 -v -timeout 10m

      - name: Run isolated P1 HTTP integration
        run: go test ./internal/integration -run TestP1CoreIntegration -count=1 -v -timeout 35m

      - name: Run isolated RustFS full-stack integration
        timeout-minutes: 40
        run: go test ./internal/integration -run TestRustFSFullStackIntegration -count=1 -v -timeout 30m

      - name: Set up Bun for browser acceptance
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install Playwright dependencies
        working-directory: e2e
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: e2e
        run: bunx playwright install --with-deps chromium

      - name: Run real-browser acceptance
        timeout-minutes: 40
        run: ./e2e/run-e2e.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production backend image (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag actfb-backend:ci \
            --cache-from type=gha,scope=actfb-backend \
            --cache-to type=gha,mode=max,scope=actfb-backend \
            --file Dockerfile \
            .

      - name: Build production frontend image (no push)
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag actfb-frontend:ci \
            --build-arg VITE_API_BASE_URL=/api \
            --cache-from type=gha,scope=actfb-frontend \
            --cache-to type=gha,mode=max,scope=actfb-frontend \
            --file frontend/Dockerfile \
            frontend

      - name: Packaging contract checks
        env:
          ACTFB_TEST_IMAGES: "1"
          ACTFB_BACKEND_IMAGE: actfb-backend:ci
          ACTFB_FRONTEND_IMAGE: actfb-frontend:ci
        run: ./scripts/test-production-packaging.sh

      - name: Production image runtime smoke
        env:
          ACTFB_BACKEND_IMAGE: actfb-backend:ci
          ACTFB_FRONTEND_IMAGE: actfb-frontend:ci
        run: ./scripts/test-production-runtime.sh

      - name: Upload failed browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-browser-artifacts
          path: |
            e2e/test-results/**
            e2e/playwright-report/**
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish images
    needs: [backend, frontend, integration]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    env:
      BACKEND_IMAGE: ghcr.io/nrf24l01/actfb-backend
      FRONTEND_IMAGE: ghcr.io/nrf24l01/actfb-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend_push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/nrf24l01/actfb-backend:latest
            ghcr.io/nrf24l01/actfb-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=sha-${{ github.sha }}
          cache-from: type=gha,scope=actfb-backend
          cache-to: type=gha,mode=max,scope=actfb-backend

      - name: Build and push frontend image
        id: frontend_push
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/nrf24l01/actfb-frontend:latest
            ghcr.io/nrf24l01/actfb-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          build-args: |
            VITE_API_BASE_URL=/api
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=sha-${{ github.sha }}
          cache-from: type=gha,scope=actfb-frontend
          cache-to: type=gha,mode=max,scope=actfb-frontend

      - name: Publish summary
        run: |
          set -euo pipefail
          immutable_tag="sha-${GITHUB_SHA}"
          backend_digest='${{ steps.backend_push.outputs.digest }}'
          frontend_digest='${{ steps.frontend_push.outputs.digest }}'

          compressed_size() {
            local ref="$1"
            local raw
            raw="$(docker buildx imagetools inspect "$ref" --raw)"
            if jq -e '.manifests' >/dev/null 2>&1 <<<"$raw"; then
              local child
              child="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<<"$raw" | head -n1)"
              [[ -n "$child" && "$child" != "null" ]] && raw="$(docker buildx imagetools inspect "${ref%%:*}@${child}" --raw)"
            fi
            jq -r '([.layers[]?.size] | add) // "n/a"' <<<"$raw"
          }

          backend_size="$(compressed_size "${BACKEND_IMAGE}:${immutable_tag}")"
          frontend_size="$(compressed_size "${FRONTEND_IMAGE}:${immutable_tag}")"

          {
            echo "## Published images"
            echo
            echo "| Image | Tags | Digest | Compressed size |"
            echo "| --- | --- | --- | --- |"
            echo "| \`${BACKEND_IMAGE}\` | \`latest\`, \`${immutable_tag}\` | \`${backend_digest}\` | ${backend_size} bytes |"
            echo "| \`${FRONTEND_IMAGE}\` | \`latest\`, \`${immutable_tag}\` | \`${frontend_digest}\` | ${frontend_size} bytes |"
            echo
            echo "Platform: \`linux/amd64\`."
          } >> "$GITHUB_STEP_SUMMARY"