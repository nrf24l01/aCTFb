# Optional external TLS edge real-IP trust. Intentionally empty by default.
# The frontend image bakes this empty file; deploy/compose.yaml does not mount it.
# If a separate TLS edge fronts this nginx, mount this file over
# /etc/nginx/realip.conf and list only that edge's explicit source CIDR:
#
# set_real_ip_from 192.0.2.10;
# real_ip_header X-Forwarded-For;
# real_ip_recursive on;
#
# Never use 0.0.0.0/0 or ::/0 here. The default Compose path terminates TLS in
# front of the loopback-published frontend and does not enable this trust.