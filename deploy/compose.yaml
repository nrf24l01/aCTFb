name: actfb-prod

# CONFIG_FILE is /app/config.yaml. Processes that load the YAML config mount the
# downloaded ./config.yaml read-only over the image copy. The file contains app
# secrets, so it is group-readable only by the runtime GID 10001 (0640); never
# make it world-readable. Datasource values still come from .env.

x-postgres-environment: &postgres-environment
  CONFIG_FILE: /app/config.yaml
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:-actfb}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  POSTGRES_DBNAME: ${POSTGRES_DB:-actfb}
  POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
  POSTGRES_TIMEZONE: UTC

x-nats-environment: &nats-environment
  NATS_HOST: nats
  NATS_PORT: "4222"

# Datasource connections/secrets only. Application settings, JWT signing keys,
# cookie/origin policy, feature flags, worker limits, and app secrets live in
# the mounted config.yaml.
x-backend-environment: &backend-environment
  <<: [*postgres-environment, *nats-environment]
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-}
  S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}

services:
  backend:
    image: ghcr.io/nrf24l01/actfb-backend:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - plugins-data:/app/plugins
    networks:
      - actfb-net
      - actfb-proxy

  frontend:
    image: ghcr.io/nrf24l01/actfb-frontend:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-proxy

  # Default baseline worker: PostgreSQL-only retention daemon.
  retention:
    image: ghcr.io/nrf24l01/actfb-retention:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: *postgres-environment
      POSTGRES_USER: ${RETENTION_POSTGRES_USER:-${POSTGRES_USER:-actfb}}
      POSTGRES_PASSWORD: ${RETENTION_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - actfb-net

  # Default baseline worker: PostgreSQL -> NATS outbox dispatcher.
  events-dispatcher:
    image: ghcr.io/nrf24l01/actfb-events-dispatcher:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *nats-environment]
      POSTGRES_USER: ${EVENTS_POSTGRES_USER:-${POSTGRES_USER:-actfb}}
      POSTGRES_PASSWORD: ${EVENTS_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - actfb-net

  # SMTP delivery profile. Requires email.enabled: true in config.yaml plus SMTP_* datasource values.
  notification:
    profiles: ["email"]
    image: ghcr.io/nrf24l01/actfb-notification:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: *nats-environment
      CONFIG_FILE: /app/config.yaml
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      nats:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - actfb-net

  # Optional file pipeline. storage-init is a one-shot bucket initializer.
  storage-init:
    profiles: ["files"]
    image: ghcr.io/nrf24l01/actfb-storage-init:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: "no"
    environment:
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  file-scanner:
    profiles: ["files"]
    image: ghcr.io/nrf24l01/actfb-file-scanner:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *nats-environment]
      POSTGRES_USER: ${SCANNER_POSTGRES_USER:-${POSTGRES_USER:-actfb}}
      POSTGRES_PASSWORD: ${SCANNER_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      CLAMAV_ADDRESS: ${CLAMAV_ADDRESS:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      backend:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - actfb-net

  # Trusted plugin supervisor. It shares the backend network namespace only so
  # its loopback control endpoint and plugin assets are reachable. It, not the
  # backend, receives the Docker socket.
  plugin-runner:
    profiles: ["plugins"]
    image: ghcr.io/nrf24l01/actfb-plugin-runner:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    network_mode: "service:backend"
    restart: unless-stopped
    environment:
      CONFIG_FILE: /app/config.yaml
      ACTFB_DOCKER_SOCKET: /var/run/docker.sock
      ACTFB_PLUGIN_RUNNER_NETWORK: ${ACTFB_PLUGIN_RUNNER_NETWORK:-actfb-prod_actfb-net}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${ACTFB_DOCKER_GID:-999}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Trusted A+D checker worker; the only production image with git/docker CLI.
  ad-worker:
    profiles: ["ad"]
    image: ghcr.io/nrf24l01/actfb-ad-worker:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *nats-environment]
      POSTGRES_USER: ${AD_POSTGRES_USER:-${POSTGRES_USER:-actfb}}
      POSTGRES_PASSWORD: ${AD_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${ACTFB_DOCKER_GID:-999}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  # Trusted runtime worker. No Docker CLI; it uses the Go Docker API.
  instance-worker:
    profiles: ["runtime"]
    image: ghcr.io/nrf24l01/actfb-instance-worker:${ACTFB_IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      <<: [*postgres-environment, *nats-environment]
      POSTGRES_USER: ${RUNTIME_POSTGRES_USER:-${POSTGRES_USER:-actfb}}
      POSTGRES_PASSWORD: ${RUNTIME_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}}
      ACTFB_INSTANCE_WORKER_DOCKER_SOCKET: /var/run/docker.sock
      ACTFB_INSTANCE_WORKER_PODMAN_SOCKET: ""
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${ACTFB_DOCKER_GID:-999}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - actfb-net

  postgres:
    image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-actfb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-actfb}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - actfb-net

  redis:
    image: redis:7-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - actfb-net

  nats:
    image: nats:2-alpine@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - actfb-net

volumes:
  postgres-data:
  redis-data:
  nats-data:
  plugins-data:

networks:
  # Database/worker traffic. No frontend and no trusted-proxy source here.
  actfb-net:
    driver: bridge
  # Only nginx and the backend share this network. The explicit subnet is the
  # backend's trusted-proxy value, so DB/worker peers cannot forge a client IP.
  actfb-proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${ACTFB_PROXY_SUBNET:-10.213.77.0/28}